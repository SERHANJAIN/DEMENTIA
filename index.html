  <title>WithYou — A little help, right when you need it</title>
  <style>
    :root {
      --navy: #243b53;
      --navy-soft: #e8eef4;
      --sage: #dce9de;
      --sage-deep: #426b54;
      --teal: #dcefed;
      --teal-deep: #286b6c;
      --peach: #f9e7d9;
      --terracotta: #a95843;
      --sand: #efe4d5;
      --paper: #f8f7f2;
      --white: #ffffff;
      --ink: #203244;
      --muted: #5c6b78;
      --line: #dbe1e4;
      --focus: #1b6f83;
      --danger: #9b302b;
      --shadow: 0 4px 18px rgba(36,59,83,.08);
      --radius: 20px;
      --tap: 58px;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; color: var(--ink); font-family: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 18px; line-height: 1.5; background: var(--paper); min-height: 100vh; }
    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: var(--navy); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .shell { max-width: 780px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { padding: max(14px, env(safe-area-inset-top)) 18px 14px; background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(36,59,83,.08); position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center; border-radius: 15px; background: var(--navy); color: white; }
    .brand-name { font-size: 23px; line-height: 1.12; font-weight: 800; letter-spacing: -.4px; }
    .brand-tagline { font-size: 13px; color: var(--muted); line-height: 1.25; margin-top: 3px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button { min-width: 48px; min-height: 48px; border: 1px solid var(--line); border-radius: 15px; background: var(--white); color: var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; font-weight: 700; }
    main { flex: 1; padding: 22px 18px calc(34px + env(safe-area-inset-bottom)); }
    .eyebrow { color: var(--sage-deep); text-transform: uppercase; font-weight: 800; font-size: 13px; letter-spacing: .09em; margin: 0 0 6px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(29px, 6vw, 38px); line-height: 1.14; letter-spacing: -.6px; margin-bottom: 10px; font-weight: 800; }
    h2 { font-size: 25px; line-height: 1.2; margin-bottom: 8px; letter-spacing: -.3px; }
    h3 { font-size: 20px; line-height: 1.25; margin-bottom: 7px; }
    p { margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .small { font-size: 15px; }
    .lead { font-size: 20px; color: #465969; }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .view-head .head-copy { min-width: 0; }
    .back-button { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; color: var(--navy); font-weight: 800; min-height: 44px; padding: 4px 0 12px; margin-bottom: 8px; }
    .home-intro { padding: 5px 0 22px; }
    .home-intro h1 { max-width: 570px; }
    .home-intro .lead { max-width: 600px; margin-bottom: 0; }
    .home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .home-card { min-height: 132px; border: 1px solid rgba(36,59,83,.08); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; color: var(--ink); box-shadow: var(--shadow); gap: 12px; transition: transform .12s ease, box-shadow .12s ease; }
    .home-card:active { transform: scale(.985); box-shadow: none; }
    .home-card .card-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; }
    .home-card .card-label { font-size: 19px; line-height: 1.22; font-weight: 800; display: block; }
    .home-card .card-sub { display: block; font-size: 14px; line-height: 1.35; color: #4f5f6b; margin-top: 5px; font-weight: 500; }
    .tone-navy { background: var(--navy-soft); }
    .tone-navy .card-icon { background: var(--navy); color: #fff; }
    .tone-sage { background: #e8f0e7; }
    .tone-sage .card-icon { background: #c7ddc9; color: #254b35; }
    .tone-teal { background: #e4f1ef; }
    .tone-teal .card-icon { background: #c8e5e1; color: #1d6064; }
    .tone-peach { background: #faeadf; }
    .tone-peach .card-icon { background: #f0d2bc; color: #7a3c2f; }
    .tone-sand { background: #f1e6d7; }
    .tone-sand .card-icon { background: #e1c8a9; color: #684b34; }
    .tone-rose { background: #f4e5df; }
    .tone-rose .card-icon { background: #e8c8bb; color: #7c4438; }
    .notice { display: flex; align-items: flex-start; gap: 12px; padding: 15px 16px; border-radius: 17px; background: #eef2f4; margin: 20px 0; }
    .notice-icon { color: var(--navy); margin-top: 2px; flex: 0 0 auto; }
    .notice p:last-child { margin-bottom: 0; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0; box-shadow: 0 2px 8px rgba(36,59,83,.035); }
    .panel.soft-sage { background: #edf4ec; border-color: #d8e6d6; }
    .panel.soft-peach { background: #fbefe7; border-color: #f2ddd0; }
    .panel.soft-teal { background: #e9f4f2; border-color: #d1e7e2; }
    .panel.soft-navy { background: #edf1f6; border-color: #dbe3ed; }
    .panel-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 14px; background: var(--navy-soft); color: var(--navy); font-weight: 800; }
    .primary, .secondary, .danger-button { width: 100%; min-height: var(--tap); border-radius: 16px; padding: 13px 16px; border: 2px solid transparent; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center; text-decoration: none; line-height: 1.25; }
    .primary { color: white; background: var(--navy); }
    .primary:active { background: #172f46; }
    .secondary { color: var(--navy); background: #edf1f4; border-color: #dbe3e9; }
    .danger-button { color: white; background: var(--danger); }
    .small-button { min-height: 46px; padding: 9px 12px; font-size: 16px; border-radius: 13px; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .button-row > * { flex: 1 1 170px; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-weight: 800; font-size: 17px; }
    .field input, .field textarea, .field select { width: 100%; min-height: 54px; border: 2px solid #ced8de; background: #fff; color: var(--ink); border-radius: 13px; padding: 12px 14px; font-size: 18px; }
    .field textarea { min-height: 112px; resize: vertical; }
    .field .hint { font-size: 14px; color: var(--muted); }
    .form-section { margin: 22px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
    .form-actions { margin-top: 20px; }
    .empty { padding: 25px 18px; text-align: center; border: 2px dashed #d5dee2; border-radius: var(--radius); background: rgba(255,255,255,.55); }
    .empty .empty-icon { display: inline-grid; place-items: center; width: 55px; height: 55px; background: var(--teal); border-radius: 18px; color: var(--teal-deep); margin-bottom: 12px; }
    .item-list { display: flex; flex-direction: column; gap: 12px; }
    .item { background: white; border: 1px solid var(--line); border-radius: 17px; padding: 15px; display: flex; gap: 13px; align-items: flex-start; }
    .item .item-main { min-width: 0; flex: 1; }
    .item .item-actions { display: flex; flex-direction: column; gap: 7px; min-width: 88px; }
    .item h3 { overflow-wrap: anywhere; }
    .item p:last-child { margin-bottom: 0; }
    .item p { font-size: 16px; color: var(--muted); margin-bottom: 7px; }
    .photo { width: 76px; height: 76px; object-fit: cover; border-radius: 16px; background: #e9efec; flex: 0 0 auto; }
    .photo-placeholder { display: grid; place-items: center; color: var(--navy); background: var(--sage); }
    .contact-avatar { width: 55px; height: 55px; border-radius: 17px; background: var(--navy-soft); color: var(--navy); flex: 0 0 auto; display: grid; place-items: center; }
    .relationship { color: var(--sage-deep); font-weight: 800; font-size: 16px; }
    .task-row { display: flex; align-items: flex-start; gap: 13px; width: 100%; }
    .task-check { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; background: var(--sage); color: var(--sage-deep); border: 2px solid #b5ceb8; border-radius: 14px; }
    .task-check.done { background: var(--sage-deep); color: white; border-color: var(--sage-deep); }
    .task-body { flex: 1; min-width: 0; }
    .task-body h3 { margin-bottom: 4px; }
    .task-body .done-label { color: var(--sage-deep); font-weight: 800; font-size: 14px; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0; }
    .month-name { font-size: 21px; font-weight: 800; text-align: center; flex: 1; }
    .month-nav { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line); background: white; color: var(--navy); border-radius: 14px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .weekday { text-align: center; color: var(--muted); font-size: 13px; font-weight: 800; padding: 7px 0; }
    .day { min-height: 52px; border: 1px solid #e1e6e8; background: white; color: var(--ink); border-radius: 12px; padding: 5px 0; display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 1px; position: relative; }
    .day.muted-day { color: #8b969c; background: #f4f5f4; }
    .day.selected { color: white; border-color: var(--navy); background: var(--navy); }
    .day.today:not(.selected) { border: 2px solid var(--terracotta); }
    .day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--terracotta); }
    .day.selected .dot { background: #fff; }
    .map { height: 310px; border-radius: 18px; border: 1px solid var(--line); background: #e8eeeb; overflow: hidden; margin: 14px 0; }
    .map-placeholder { min-height: 230px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--muted); background: #e9efec; border-radius: 17px; }
    .map-note { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--muted); margin-top: 10px; }
    .status-line { display: flex; gap: 9px; align-items: flex-start; font-weight: 700; margin-bottom: 8px; }
    .status-line svg { flex: 0 0 auto; margin-top: 3px; }
    .profile-line { padding: 12px 0; border-bottom: 1px solid #e6ebed; display: grid; grid-template-columns: minmax(100px, .75fr) minmax(0, 1.25fr); gap: 12px; align-items: start; }
    .profile-line:last-child { border-bottom: 0; }
    .profile-key { color: var(--muted); font-size: 16px; }
    .profile-value { font-weight: 700; overflow-wrap: anywhere; }
    .footer-note { margin-top: 26px; color: #65727b; font-size: 14px; text-align: center; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; padding: 15px 18px; border-radius: 16px; background: var(--navy); color: white; box-shadow: 0 6px 30px rgba(0,0,0,.22); z-index: 80; font-weight: 700; }
    .hidden { display: none !important; }
    .file-input { display: none; }
    .check-label { display: flex; align-items: flex-start; gap: 10px; font-size: 16px; }
    .check-label input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--sage-deep); }
    .small-link { display: inline-flex; min-height: 44px; align-items: center; color: var(--navy); font-weight: 800; }
    .summary-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
    .summary-cell { background: white; border: 1px solid var(--line); border-radius: 15px; padding: 14px; }
    .summary-number { font-size: 27px; font-weight: 800; color: var(--navy); display: block; }
    .summary-label { font-size: 14px; color: var(--muted); }
    .install-banner { margin-top: 22px; }
    @media (min-width: 640px) {
      main { padding: 28px 26px 48px; }
      .topbar { padding-left: 26px; padding-right: 26px; }
      .home-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
      .home-card { min-height: 147px; padding: 18px; }
      .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .map { height: 380px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>

y or region.</span></div></div></div><div class="form-actions"><button class="primary" type="submit">${ic('check',20)} Save details</button></div></form>`;

    function dateOf(y,m,d) { const dt=new Date(y,m,d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
    function distanceKm(lat1,lon1,lat2,lon2) { const R=6371; const rad=x=>x*Math.PI/180; const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1); const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2; return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
    function bearingText(lat1,lon1,lat2,lon2) { const rad=x=>x*Math.PI/180; const deg=x=>x*180/Math.PI; const y=Math.sin(rad(lon2-lon1))*Math.cos(rad(lat2)); const x=Math.cos(rad(lat1))*Math.sin(rad(lat2))-Math.sin(rad(lat1))*Math.cos(rad(lat2))*Math.cos(rad(lon2-lon1)); let b=(deg(Math.atan2(y,x))+360)%360; return ['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(b/45)%8]; }
    function directionsUrl() { const dest=encodeURIComponent(state.profile.homeAddress || 'home'); if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) return `https://maps.apple.com/?daddr=${dest}&dirflg=w`; return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`; }
    async function geocodeAddress(address) {
      try { const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(address)}`; const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok) return null; const rows=await res.json(); if(!rows.length) return null; return {lat:Number(rows[0].lat),lon:Number(rows[0].lon)}; } catch(e) { return null; }
    }
    async function locate() {
      if (!navigator.geolocation) { showToast('This phone cannot share its location with the browser. You can still open walking directions.'); return; }
      showToast('Finding your location. Please allow location access if asked.');
      navigator.geolocation.getCurrentPosition(async pos=>{
        routeCoords={lat:pos.coords.latitude,lon:pos.coords.longitude};
        homeCoords=await geocodeAddress(state.profile.homeAddress);
        render();
        if(homeCoords) {
          const d=distanceKm(routeCoords.lat,routeCoords.lon,homeCoords.lat,homeCoords.lon);
          speak(d<.15 ? 'You seem to be very close to home. For the safest route, open walking directions.' : `Home is about ${d<1?Math.round(d*1000)+' metres':d.toFixed(1)+' kilometres'} away, ${bearingText(routeCoords.lat,routeCoords.lon,homeCoords.lat,homeCoords.lon)}. The dotted line is not a walking path. Tap open walking directions to get the route.`);
        } else speak('I found your location, but could not pinpoint your saved home on the simple map. Tap open walking directions and your phone map can try the address.');
      }, err=>{ showToast(err.code===1?'Location permission was not allowed. You can still open walking directions.':'I could not find your location. Please try again or open walking directions.'); }, {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    }
    function drawMap() {
      const mapEl=document.getElementById('map'); if(!mapEl) return;
      if(!window.L) { mapEl.innerHTML='<div class="map-placeholder">The map could not load. Please check your internet connection and use walking directions below.</div>'; return; }
      if(leafletMap) { try{leafletMap.remove();}catch(e){} leafletMap=null; }
      const center=homeCoords ? [(routeCoords.lat+homeCoords.lat)/2,(routeCoords.lon+homeCoords.lon)/2] : [routeCoords.lat,routeCoords.lon];
      leafletMap=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView(center,homeCoords?13:16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
      L.circleMarker([routeCoords.lat,routeCoords.lon],{radius:9,color:'#243b53',weight:3,fillColor:'#243b53',fillOpacity:1}).addTo(leafletMap).bindPopup('You are here');
      if(homeCoords) {
        L.circleMarker([homeCoords.lat,homeCoords.lon],{radius:9,color:'#a95843',weight:3,fillColor:'#a95843',fillOpacity:1}).addTo(leafletMap).bindPopup('Home');
        L.polyline([[routeCoords.lat,routeCoords.lon],[homeCoords.lat,homeCoords.lon]],{color:'#a95843',weight:4,dashArray:'6 9',opacity:.8}).addTo(leafletMap);
        leafletMap.fitBounds([[routeCoords.lat,routeCoords.lon],[homeCoords.lat,homeCoords.lon]],{padding:[28,28],maxZoom:15});
      }
      setTimeout(()=>leafletMap && leafletMap.invalidateSize(),100);
    }
    function checkDueReminders() {
      if (!state || !state.profile || !state.profile.name) return;
      const now=new Date(); const today=todayStr(); const hhmm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const all=[...state.medicines.map(m=>({...m,_kind:'Medicine'})),...state.tasks.map(t=>({...t,_kind:'Reminder'}))];
      for(const item of all) {
        if(!item.time || item.time!==hhmm) continue;
        if(item._kind==='Reminder' && item.repeat!=='daily' && item.date!==today) continue;
        if(item._kind==='Medicine' && (item.takenDates||[]).includes(today)) continue;
        if(item._kind==='Reminder' && (item.completedDates||[]).includes(today)) continue;
        const k=`${today}-${item._kind}-${item.id}-${hhmm}`;
        if(firedReminders.has(k)) continue; firedReminders.add(k);
        const msg=`WithYou reminder: ${item._kind.toLowerCase()} time. ${item.name||item.title}.`;
        if('Notification' in window && Notification.permission==='granted' && document.visibilityState==='visible') {
          try { new Notification('WithYou reminder',{body:msg,icon:'./icons/icon-192.png',tag:k}); } catch(e) {}
        }
        showToast(msg);
      }
    }
    async function askNotifications() {
      if (!('Notification' in window)) { showToast('Notifications are not available in this browser. You can still see reminders inside WithYou.'); return; }
      try { const result=await Notification.requestPermission(); showToast(result==='granted'?'Notifications are enabled while WithYou is open. Background alerts need extra push setup.': 'Notifications were not enabled. You can still check reminders inside WithYou.'); } catch(e) { showToast('This browser could not enable notifications.'); }
    }
    function resizeImage(file) {
      return new Promise((resolve,reject)=>{
        if(!file) return resolve('');
        if(!file.type.startsWith('image/')) return reject(new Error('Please choose an image file.'));
        const reader=new FileReader(); reader.onerror=()=>reject(new Error('I could not read that photo.'));
        reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1000; const scale=Math.min(1,max/Math.max(img.width,img.height)); const canvas=document.createElement('canvas'); canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale); const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height); resolve(canvas.toDataURL('image/jpeg',.76)); }; img.onerror=()=>reject(new Error('I could not open that photo.')); img.src=reader.result; };
        reader.readAsDataURL(file);
      });
    }
    function findItem(list,id) { return list.find(item=>item.id===id); }
    async function handleSubmit(event) {
      const form=event.target.closest('form[data-form]'); if(!form) return;
      event.preventDefault(); const fd=new FormData(form); const data=Object.fromEntries(fd.entries()); const type=form.dataset.form;
      if(type!=='setup' && type!=='family-unlock' && !caregiverUnlocked) { requireCaregiver(); return; }
      try {
        if(type==='setup') {
          state.profile={...state.profile,name:String(data.name||'').trim(),homeAddress:String(data.homeAddress||'').trim(),phone:String(data.phone||'').trim(),email:String(data.email||'').trim(),emergencyName:String(data.emergencyName||'').trim(),emergencyPhone:String(data.emergencyPhone||'').trim(),emergencyServiceNumber:'112',doctorName:'',doctorPhone:'',caregiverPin:''};
          await save(); currentView='home'; render(); speak(`Welcome to WithYou, ${state.profile.name}. What would you like help with today?`); return;
        }
        if(type==='family-unlock') {
          const pin=String(data.pin||'');
          if(state.profile.caregiverPin) { if(pin!==state.profile.caregiverPin) { showToast('That PIN did not match. Please try again.'); return; } }
          else { if(!/^\d{4}$/.test(pin) || pin!==String(data.pinConfirm||'')) { showToast('Please enter the same 4-digit PIN twice.'); return; } state.profile.caregiverPin=pin; await save(); }
          caregiverUnlocked=true; currentView='family'; render(); showToast('Family editing is unlocked on this device.'); return;
        }
        if(type==='profile') {
          state.profile={...state.profile,name:String(data.name||'').trim(),homeAddress:String(data.homeAddress||'').trim(),phone:String(data.phone||'').trim(),email:String(data.email||'').trim(),emergencyName:String(data.emergencyName||'').trim(),emergencyPhone:String(data.emergencyPhone||'').trim(),doctorName:String(data.doctorName||'').trim(),doctorPhone:String(data.doctorPhone||'').trim(),emergencyServiceNumber:String(data.emergencyServiceNumber||'112').trim()};
          await save(); currentView='about'; homeCoords=null; render(); showToast('Personal details saved.'); return;
        }
        if(type==='contact') {
          state.contacts.push({id:uid(),name:String(data.name||'').trim(),relationship:String(data.relationship||'').trim(),phone:String(data.phone||'').trim(),note:String(data.note||'').trim()}); await save(); currentView='contacts'; render(); showToast('Person saved.'); return;
        }
        if(type==='memory') {
          const photo=await resizeImage(form.querySelector('[name="photo"]').files[0]);
          state.memories.push({id:uid(),title:String(data.title||'').trim(),person:String(data.person||'').trim(),relationship:String(data.relationship||'').trim(),note:String(data.note||'').trim(),photo,createdAt:new Date().toISOString()}); await save(); currentView='memories'; render(); showToast('Memory saved.'); return;
        }
        if(type==='medicine') {
          state.medicines.push({id:uid(),name:String(data.name||'').trim(),dose:String(data.dose||'').trim(),time:String(data.time||''),notes:String(data.notes||'').trim(),takenDates:[]}); await save(); currentView='medicines'; render(); showToast('Medicine saved.'); return;
        }
        if(type==='appointment') {
          state.appointments.push({id:uid(),title:String(data.title||'').trim(),date:String(data.date||selectedDate),time:String(data.time||''),place:String(data.place||'').trim(),notes:String(data.notes||'').trim()}); selectedDate=String(data.date||selectedDate); calendarMonth=new Date(`${selectedDate}T12:00:00`); calendarMonth.setDate(1); await save(); currentView='appointments'; render(); showToast('Doctor visit added to the calendar.'); return;
        }
        if(type==='task') {
          state.tasks.push({id:uid(),title:String(data.title||'').trim(),time:String(data.time||''),repeat:String(data.repeat||'daily'),date:String(data.date||todayStr()),notes:String(data.notes||'').trim(),completedDates:[]}); await save(); currentView='tasks'; render(); showToast('Reminder saved.'); return;
        }
      } catch(err) { console.error(err); showToast(err.message || 'I could not save that. Please try again.'); }
    }
    async function toggleTask(id) { const t=findItem(state.tasks,id); if(!t) return; t.completedDates=t.completedDates||[]; const i=t.completedDates.indexOf(todayStr()); if(i>=0)t.completedDates.splice(i,1);else t.completedDates.push(todayStr()); await save(); render(); }
    async function toggleMedicine(id) { const m=findItem(state.medicines,id); if(!m)return; m.takenDates=m.takenDates||[]; const i=m.takenDates.indexOf(todayStr()); if(i>=0)m.takenDates.splice(i,1);else m.takenDates.push(todayStr()); await save(); render(); }
    async function deleteEntry(listName,id,view,message) { if(!caregiverUnlocked){requireCaregiver();return;} const item=state[listName].find(x=>x.id===id); if(!item)return; if(!confirm(`Remove “${item.name||item.title}”? This cannot be undone unless you have a backup.`))return; state[listName]=state[listName].filter(x=>x.id!==id); await save(); currentView=view; render(); showToast(message); }
    async function exportBackup() {
      const payload={app:'WithYou',schemaVersion:1,exportedAt:new Date().toISOString(),state};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`withyou-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('Backup created. Keep the file somewhere private.');
    }
    function importBackup() { importInput.click(); }
    importInput.addEventListener('change', async () => {
      if(!importInput.files || !importInput.files[0]) return;
      if(!caregiverUnlocked) { importInput.value=''; requireCaregiver(); return; }
      try { const txt=await importInput.files[0].text(); const payload=JSON.parse(txt); const data=payload.state||payload; if(!data.profile || !Array.isArray(data.contacts) || !Array.isArray(data.memories)) throw new Error('That does not look like a WithYou backup.'); if(!confirm('Replace the information on this phone with the backup? Export a backup first if you want to keep the current information.')) return; state={...defaultState(),...data,profile:{...defaultState().profile,...data.profile}}; await save(); currentView='home'; render(); showToast('Backup imported.'); } catch(err) { showToast(err.message||'I could not import that backup.'); } finally { importInput.value=''; }
    });
    function installApp() {
      if(deferredInstallPrompt) { deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.then(choice=>{ showToast(choice.outcome==='accepted'?'WithYou was added to your home screen.':'You can install WithYou later from your browser menu.'); deferredInstallPrompt=null; }); }
      else { currentView='install-help'; render(); }
    }
    window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstallPrompt=e; });
    document.addEventListener('click', async event => {
      const el=event.target.closest('[data-action]'); if(!el)return;
      const action=el.dataset.action;
      if(action==='go') { currentView=el.dataset.view||'home'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='speak-home') { const pageText=main.innerText.replace(/\s+/g,' ').slice(0,1200); speak(pageText || `Hello ${sayName()}. What would you like help with?`); return; }
      if(action==='speak') { speak(el.dataset.text||''); return; }
      if(action==='locate') { locate(); return; }
      if(action==='notifications') { askNotifications(); return; }
      if(action==='install-help') { currentView='install-help'; render(); return; }
      if(action==='install') { installApp(); return; }
      if(action==='lock-family') { caregiverUnlocked=false; currentView='family'; render(); showToast('Family editing is locked.'); return; }
      if(action==='toggle-task') { toggleTask(el.dataset.id); return; }
      if(action==='toggle-medicine') { toggleMedicine(el.dataset.id); return; }
      if(action==='delete-contact') { deleteEntry('contacts',el.dataset.id,'contacts','Person removed.'); return; }
      if(action==='delete-memory') { deleteEntry('memories',el.dataset.id,'memories','Memory removed.'); return; }
      if(action==='delete-medicine') { deleteEntry('medicines',el.dataset.id,'medicines','Medicine removed.'); return; }
      if(action==='delete-task') { deleteEntry('tasks',el.dataset.id,'tasks','Reminder removed.'); return; }
      if(action==='delete-appointment') { deleteEntry('appointments',el.dataset.id,'appointments','Appointment removed.'); return; }
      if(action==='month-prev') { calendarMonth.setMonth(calendarMonth.getMonth()-1); render(); return; }
      if(action==='month-next') { calendarMonth.setMonth(calendarMonth.getMonth()+1); render(); return; }
      if(action==='calendar-today') { selectedDate=todayStr(); calendarMonth=new Date(); calendarMonth.setDate(1); render(); return; }
      if(action==='select-date') { selectedDate=el.dataset.date; render(); return; }
      if(action==='export') { if(!caregiverUnlocked){requireCaregiver();return;} exportBackup(); return; }
      if(action==='import') { if(!caregiverUnlocked){requireCaregiver();return;} importBackup(); return; }
    });
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('change', async e=>{
      if(e.target && e.target.id==='memory-photo' && e.target.files && e.target.files[0]) {
        try { const data=await resizeImage(e.target.files[0]); const preview=document.getElementById('photo-preview'); if(preview){preview.innerHTML=`<img class="photo" src="${data}" alt="Photo preview" style="width:120px;height:120px">`;preview.classList.remove('hidden');} } catch(err){showToast(err.message);}
      }
      if(e.target && e.target.id==='task-repeat') { const f=document.getElementById('task-date-field'); if(f) f.classList.toggle('hidden',e.target.value!=='once'); }
    });
    initStorage();
  })();
  </script>
