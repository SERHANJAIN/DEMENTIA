<!doctype html>
<html lang="en">
<head>

  <title>carey — A little help, right when you need it</title>
  <style>
    :root {
      --navy: #243b53;
      --navy-soft: #e8eef4;
      --sage: #dce9de;
      --sage-deep: #426b54;
      --teal: #dcefed;
      --teal-deep: #286b6c;
      --peach: #f9e7d9;
      --terracotta: #a95843;
      --sand: #efe4d5;
      --paper: #f8f7f2;
      --white: #ffffff;
      --ink: #203244;
      --muted: #5c6b78;
      --line: #dbe1e4;
      --focus: #1b6f83;
      --danger: #9b302b;
      --shadow: 0 4px 18px rgba(36,59,83,.08);
      --radius: 20px;
      --tap: 50px;
      --daily-background: linear-gradient(145deg, #f5f6ee 0%, #e8f0eb 52%, #f9eee5 100%);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; color: var(--ink); font-family: "Atkinson Hyperlegible", "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; line-height: 1.42; background: var(--daily-background); background-attachment: fixed; min-height: 100vh; transition: background 500ms ease; }
    button, input, textarea, select { font: inherit; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: var(--navy); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .shell { max-width: 780px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: transparent; }
    .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; background: rgba(248,247,242,.9); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(36,59,83,.08); position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; border-radius: 13px; background: var(--navy); color: white; }
    .brand-name { font-size: 22px; line-height: 1.12; font-weight: 800; letter-spacing: -.35px; }
    .brand-tagline { font-size: 12px; color: var(--muted); line-height: 1.25; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button { min-width: 42px; min-height: 42px; border: 1px solid var(--line); border-radius: 13px; background: var(--white); color: var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 10px; font-weight: 700; }
    .speaker-button { width: 40px; height: 40px; flex: 0 0 40px; padding: 0; border: 1px solid rgba(36,59,83,.14); border-radius: 50%; background: #fff; color: var(--navy); display: inline-grid; place-items: center; box-shadow: 0 2px 8px rgba(36,59,83,.06); }
    .speaker-button:active { transform: scale(.96); }
    main { flex: 1; padding: 14px 12px calc(24px + env(safe-area-inset-bottom)); }
    .eyebrow { color: var(--sage-deep); text-transform: uppercase; font-weight: 800; font-size: 13px; letter-spacing: .09em; margin: 0 0 6px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(25px, 5.5vw, 34px); line-height: 1.12; letter-spacing: -.45px; margin-bottom: 7px; font-weight: 800; }
    h2 { font-size: 21px; line-height: 1.2; margin-bottom: 7px; letter-spacing: -.25px; }
    h3 { font-size: 17px; line-height: 1.24; margin-bottom: 5px; }
    p { margin-bottom: 10px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .lead { font-size: 16px; color: #465969; }
    .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .view-head .head-copy { min-width: 0; }
    .back-button { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; color: var(--navy); font-weight: 800; min-height: 38px; padding: 2px 0 8px; margin-bottom: 5px; }
    .home-intro { padding: 2px 0 10px; }
    .home-intro h1 { max-width: 570px; }
    .home-intro .lead { max-width: 600px; margin-bottom: 0; }
    .home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .home-card { min-height: 78px; border: 1px solid rgba(36,59,83,.08); border-radius: 15px; padding: 8px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ink); box-shadow: 0 2px 8px rgba(36,59,83,.055); gap: 5px; transition: transform .12s ease, box-shadow .12s ease; }
    .home-card:active { transform: scale(.985); box-shadow: none; }
    .home-card .card-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 11px; }
    .home-card .card-label { font-size: 13px; line-height: 1.18; font-weight: 800; display: block; }
    .home-card .card-sub { display: none; }
    .tone-navy { background: var(--navy-soft); }
    .tone-navy .card-icon { background: var(--navy); color: #fff; }
    .tone-sage { background: #e8f0e7; }
    .tone-sage .card-icon { background: #c7ddc9; color: #254b35; }
    .tone-teal { background: #e4f1ef; }
    .tone-teal .card-icon { background: #c8e5e1; color: #1d6064; }
    .tone-peach { background: #faeadf; }
    .tone-peach .card-icon { background: #f0d2bc; color: #7a3c2f; }
    .tone-sand { background: #f1e6d7; }
    .tone-sand .card-icon { background: #e1c8a9; color: #684b34; }
    .tone-rose { background: #f4e5df; }
    .tone-rose .card-icon { background: #e8c8bb; color: #7c4438; }
    .notice { display: flex; align-items: flex-start; gap: 12px; padding: 15px 16px; border-radius: 17px; background: #eef2f4; margin: 20px 0; }
    .notice-icon { color: var(--navy); margin-top: 2px; flex: 0 0 auto; }
    .notice p:last-child { margin-bottom: 0; }
    .panel { background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 17px; padding: 14px; margin: 10px 0; box-shadow: 0 2px 8px rgba(36,59,83,.035); }
    .panel.soft-sage { background: #edf4ec; border-color: #d8e6d6; }
    .panel.soft-peach { background: #fbefe7; border-color: #f2ddd0; }
    .panel.soft-teal { background: #e9f4f2; border-color: #d1e7e2; }
    .panel.soft-navy { background: #edf1f6; border-color: #dbe3ed; }
    .panel-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 14px; background: var(--navy-soft); color: var(--navy); font-weight: 800; }
    .primary, .secondary, .danger-button { width: 100%; min-height: var(--tap); border-radius: 16px; padding: 13px 16px; border: 2px solid transparent; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center; text-decoration: none; line-height: 1.25; }
    .primary { color: white; background: var(--navy); }
    .primary:active { background: #172f46; }
    .secondary { color: var(--navy); background: #edf1f4; border-color: #dbe3e9; }
    .danger-button { color: white; background: var(--danger); }
    .small-button { min-height: 46px; padding: 9px 12px; font-size: 16px; border-radius: 13px; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .button-row > * { flex: 1 1 170px; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-weight: 800; font-size: 17px; }
    .field input, .field textarea, .field select { width: 100%; min-height: 54px; border: 2px solid #ced8de; background: #fff; color: var(--ink); border-radius: 13px; padding: 12px 14px; font-size: 18px; }
    .field textarea { min-height: 112px; resize: vertical; }
    .field .hint { font-size: 14px; color: var(--muted); }
    .form-section { margin: 22px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
    .form-actions { margin-top: 20px; }
    .empty { padding: 25px 18px; text-align: center; border: 2px dashed #d5dee2; border-radius: var(--radius); background: rgba(255,255,255,.55); }
    .empty .empty-icon { display: inline-grid; place-items: center; width: 55px; height: 55px; background: var(--teal); border-radius: 18px; color: var(--teal-deep); margin-bottom: 12px; }
    .item-list { display: flex; flex-direction: column; gap: 9px; }
    .item { background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 15px; padding: 11px; display: flex; gap: 10px; align-items: flex-start; }
    .item .item-main { min-width: 0; flex: 1; }
    .item .item-actions { display: flex; flex-direction: column; gap: 7px; min-width: 88px; }
    .item h3 { overflow-wrap: anywhere; }
    .item p:last-child { margin-bottom: 0; }
    .item p { font-size: 16px; color: var(--muted); margin-bottom: 7px; }
    .photo { width: 76px; height: 76px; object-fit: cover; border-radius: 16px; background: #e9efec; flex: 0 0 auto; }
    .photo-placeholder { display: grid; place-items: center; color: var(--navy); background: var(--sage); }
    .contact-avatar { width: 55px; height: 55px; border-radius: 17px; background: var(--navy-soft); color: var(--navy); flex: 0 0 auto; display: grid; place-items: center; }
    .relationship { color: var(--sage-deep); font-weight: 800; font-size: 16px; }
    .task-row { display: flex; align-items: flex-start; gap: 13px; width: 100%; }
    .task-check { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; background: var(--sage); color: var(--sage-deep); border: 2px solid #b5ceb8; border-radius: 14px; }
    .task-check.done { background: var(--sage-deep); color: white; border-color: var(--sage-deep); }
    .task-body { flex: 1; min-width: 0; }
    .task-body h3 { margin-bottom: 4px; }
    .task-body .done-label { color: var(--sage-deep); font-weight: 800; font-size: 14px; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0; }
    .month-name { font-size: 21px; font-weight: 800; text-align: center; flex: 1; }
    .month-nav { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line); background: white; color: var(--navy); border-radius: 14px; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .weekday { text-align: center; color: var(--muted); font-size: 13px; font-weight: 800; padding: 7px 0; }
    .day { min-height: 52px; border: 1px solid #e1e6e8; background: white; color: var(--ink); border-radius: 12px; padding: 5px 0; display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 1px; position: relative; }
    .day.muted-day { color: #8b969c; background: #f4f5f4; }
    .day.selected { color: white; border-color: var(--navy); background: var(--navy); }
    .day.today:not(.selected) { border: 2px solid var(--terracotta); }
    .day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--terracotta); }
    .day.selected .dot { background: #fff; }
    .map { height: 310px; border-radius: 18px; border: 1px solid var(--line); background: #e8eeeb; overflow: hidden; margin: 14px 0; }
    .map-placeholder { min-height: 230px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--muted); background: #e9efec; border-radius: 17px; }
    .map-note { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--muted); margin-top: 10px; }
    .status-line { display: flex; gap: 9px; align-items: flex-start; font-weight: 700; margin-bottom: 8px; }
    .status-line svg { flex: 0 0 auto; margin-top: 3px; }
    .profile-line { padding: 12px 0; border-bottom: 1px solid #e6ebed; display: grid; grid-template-columns: minmax(100px, .75fr) minmax(0, 1.25fr); gap: 12px; align-items: start; }
    .profile-line:last-child { border-bottom: 0; }
    .profile-key { color: var(--muted); font-size: 16px; }
    .profile-value { font-weight: 700; overflow-wrap: anywhere; }
    .footer-note { margin-top: 26px; color: #65727b; font-size: 14px; text-align: center; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; padding: 15px 18px; border-radius: 16px; background: var(--navy); color: white; box-shadow: 0 6px 30px rgba(0,0,0,.22); z-index: 80; font-weight: 700; }
    .hidden { display: none !important; }
    .file-input { display: none; }
    .check-label { display: flex; align-items: flex-start; gap: 10px; font-size: 16px; }
    .check-label input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--sage-deep); }
    .small-link { display: inline-flex; min-height: 44px; align-items: center; color: var(--navy); font-weight: 800; }
    .summary-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
    .summary-cell { background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 13px; padding: 10px; }
    .summary-number { font-size: 27px; font-weight: 800; color: var(--navy); display: block; }
    .summary-label { font-size: 14px; color: var(--muted); }
    .identity-home { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .identity-copy { flex: 1; min-width: 0; }
    .identity-copy .eyebrow { margin-bottom: 2px; font-size: 11px; }
    .identity-copy h1 { font-size: clamp(23px, 5vw, 31px); margin-bottom: 3px; }
    .identity-details { font-size: 12px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
    .identity-link { background: transparent; border: 0; border-bottom: 1px solid rgba(36,59,83,.35); color: var(--navy); font-size: 12px; font-weight: 800; padding: 2px 0; margin-top: 3px; }
    .companion-avatar { width: 66px; height: 66px; flex: 0 0 66px; display: inline-block; border-radius: 50%; overflow: hidden; background: #e3efeb; box-shadow: 0 3px 12px rgba(36,59,83,.1); }
    .companion-avatar.large { width: 90px; height: 90px; flex-basis: 90px; }
    .companion-avatar.small-avatar { width: 44px; height: 44px; flex-basis: 44px; }
    .avatar-bob { animation: gentleBob 4s ease-in-out infinite; transform-origin: center; }
    .avatar-eye { transform-box: fill-box; transform-origin: center; animation: gentleBlink 5.2s ease-in-out infinite; }
    @keyframes gentleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.7px); } }
    @keyframes gentleBlink { 0%, 91%, 95%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.12); } }
    .companion-options { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 12px 0; }
    .companion-choice { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 8px; border: 2px solid #dbe3e9; background: rgba(255,255,255,.92); border-radius: 15px; cursor: pointer; color: var(--ink); text-align: center; }
    .companion-choice:has(input:checked) { border-color: var(--teal-deep); background: #e9f4f2; box-shadow: 0 0 0 2px rgba(40,107,108,.1); }
    .companion-choice input { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; accent-color: var(--teal-deep); }
    .companion-choice strong { font-size: 15px; }
    .today-priority { background: rgba(255,255,255,.76); border: 1px solid rgba(36,59,83,.1); border-radius: 17px; padding: 10px; margin: 8px 0 11px; box-shadow: 0 3px 12px rgba(36,59,83,.04); }
    .today-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .today-heading h2 { margin: 0; font-size: 18px; }
    .today-heading .date-small { font-size: 11px; color: var(--muted); }
    .today-columns { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .today-list { background: rgba(248,247,242,.78); border-radius: 12px; padding: 7px; min-width: 0; }
    .today-list-title { display: flex; align-items: center; gap: 5px; color: var(--navy); font-size: 12px; font-weight: 800; margin-bottom: 5px; }
    .today-item { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 5px 0; border-top: 1px solid rgba(36,59,83,.08); }
    .today-item:first-of-type { border-top: 0; }
    .today-item-copy { min-width: 0; flex: 1; }
    .today-item-name { font-size: 12px; line-height: 1.2; font-weight: 800; overflow-wrap: anywhere; margin: 0; }
    .today-item-meta { font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 2px; }
    .today-check { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 10px; border: 1px solid #b9cfc0; background: #e8f0e7; color: #426b54; display: grid; place-items: center; padding: 0; }
    .today-check.done { background: #426b54; color: white; }
    .today-footer { display: flex; gap: 8px; margin-top: 6px; }
    .today-footer button { background: transparent; border: 0; padding: 3px 0; font-size: 11px; font-weight: 800; color: var(--navy); }
    .guardian-strip { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 14px; border: 1px solid #d0e3d1; background: #e8f0e7; color: #294f38; text-decoration: none; font-weight: 800; margin: 8px 0; }
    .guardian-strip .guardian-copy { flex: 1; min-width: 0; }
    .guardian-strip .guardian-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #4b6b56; }
    .guardian-strip .guardian-name { display: block; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
    .guardian-strip .guardian-number { display: block; font-size: 11px; font-weight: 500; }
    .moments-gallery { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-top: 12px; }
    .moment-tile { overflow: hidden; padding: 0; border: 1px solid rgba(36,59,83,.12); border-radius: 15px; background: rgba(255,255,255,.96); box-shadow: 0 2px 8px rgba(36,59,83,.05); min-width: 0; }
    .moment-image { display: block; width: 100%; aspect-ratio: 1 / .82; object-fit: cover; background: #e4efeb; }
    .moment-image-placeholder { display: grid; place-items: center; width: 100%; aspect-ratio: 1/.82; background: linear-gradient(140deg,#e2efea,#f9e6d8); color: #426b54; }
    .moment-copy { padding: 9px; }
    .moment-title { font-size: 14px; line-height: 1.2; font-weight: 800; margin: 0 0 4px; overflow-wrap: anywhere; }
    .moment-note { font-size: 12px; color: var(--muted); line-height: 1.3; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
    .moment-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .moment-actions .speaker-button { width: 34px; height: 34px; flex-basis: 34px; }
    .home-section-label { font-size: 12px; color: var(--muted); margin: 4px 0 2px; }
    .settings-choice-row { display: flex; align-items: center; gap: 10px; }

      main { padding: 20px 26px 40px; }
      .topbar { padding-left: 26px; padding-right: 26px; }
      .home-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .home-card { min-height: 84px; padding: 9px; }
      .home-card .card-label { font-size: 14px; }
      .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .map { height: 380px; }
      .moments-gallery { grid-template-columns: repeat(3,minmax(0,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

    /* Carey refinement: warm, ambient sections; 3D portrait companions; and readable night mode. */
    .brand-side { display:flex; align-items:center; gap:7px; min-width:0; }
    .settings-top { display:inline-grid; place-items:center; width:39px; height:42px; padding:0; color:var(--navy); border:0; border-radius:12px; background:transparent; flex:0 0 39px; }
    .settings-top:active { background:rgba(36,59,83,.08); transform:scale(.96); }
    .brand-mark { border-radius:14px; }
    .home-hero { overflow:hidden; position:relative; border-radius:22px; padding:13px 13px 10px; margin:0 0 10px; background:linear-gradient(90deg,rgba(246,248,239,.90),rgba(246,248,239,.58)),url('./assets/ambient-home.svg') center/cover no-repeat; box-shadow:0 4px 18px rgba(36,59,83,.06); }
    .home-hero .home-intro { padding:0; }
    .identity-home { align-items:center; }
    .identity-copy h1 { font-size:clamp(25px,5.5vw,33px); }
    .identity-details { font-size:13px; }
    .avatar-launch { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:0; flex:0 0 auto; color:var(--navy); border:0; background:transparent; text-decoration:none; }
    .avatar-launch:active { transform:scale(.97); }

    :root[data-theme="dark"] .today-columns .today-list:first-child { background:#46372f; color:#fff5ed; }
    :root[data-theme="dark"] .today-columns .today-list:last-child { background:#294736; color:#f2faf1; }
    :root[data-theme="dark"] .today-priority { background:#132a3f; }
    :root[data-theme="dark"] .moment-tile { background:#1a3347; color:#f3f6fb; }
    :root[data-theme="dark"] .moment-text-only { background:linear-gradient(140deg,#294736,#473b2e); color:#fff8ed; }
    :root[data-theme="dark"] .moment-text-only .moment-note { color:#f3e8db; }
    :root[data-theme="dark"] .home-bottom-help { background:linear-gradient(110deg,#294736,#473b2e);color:#f5f8f2; }
    :root[data-theme="dark"] .home-bottom-help p { color:#d6e2da; }
    :root[data-theme="dark"] .settings-appearance { background:linear-gradient(130deg,#19374a,#284536),url('./assets/ambient-chat.svg') center/cover; }
    :root[data-theme="dark"] .ambient-panel { background:linear-gradient(130deg,#1c3649,#284536),url('./assets/ambient-home.svg') center/cover; }
    :root[data-theme="dark"] .ambient-note { background:linear-gradient(110deg,#223f3d,#48362f),url('./assets/ambient-moments.svg') center/cover; }
    :root[data-theme="dark"] .guardian-strip { background:linear-gradient(105deg,#294736,#263e35); color:#f3f8f2; border-color:#41664c; }
    :root[data-theme="dark"] .guardian-label,:root[data-theme="dark"] .guardian-number { color:#d0e2d1; }
    :root[data-theme="dark"] .gallery-empty { background:rgba(23,46,66,.84); color:var(--ink); }
    :root[data-theme="dark"] .moment-date { color:#c4d6d8; }
    .moment-tile { display:flex; flex-direction:column; }
    .moment-image { flex:0 0 auto; }
    .moment-text-only { justify-content:center; min-height:130px; padding:6px; background:linear-gradient(145deg,#e4f1ef,#f8e8dd); }
    .moment-text-only .moment-copy { padding:13px; }
    .moment-text-only .moment-title { font-size:16px; }
    .moment-text-only .moment-note { font-size:14px; color:#495e67; -webkit-line-clamp:unset; }
    .moments-gallery { grid-auto-flow:dense; align-items:stretch; }
    .moment-photo-tall .moment-image { aspect-ratio: .78 / 1; }
    .moment-photo-wide { grid-column:span 2; }
    .moment-photo-wide .moment-image { aspect-ratio: 1.9 / 1; }
    .moment-text-wide { grid-column:span 2; }
    .moment-date { display:block;font-size:11px;line-height:1.25;color:#637780;margin:0 0 5px; }
    .home-event-banner { display:flex;gap:10px;align-items:flex-start;padding:12px 13px;margin:8px 0 12px;border-radius:16px;background:linear-gradient(110deg,#faeadf,#e3f0e8);border:1px solid #e8d5c7;color:#243b53; }
    .home-event-banner h3 { margin:0 0 3px; }
    .home-event-banner p { margin:0;font-size:13px; }
    .family-footer { padding:13px 14px;margin:16px 0 12px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between; }
    .family-footer p { margin:3px 0 0;font-size:13px;color:var(--muted); }
    .route-dest-form { display:flex;gap:8px;align-items:stretch; }
    .route-dest-form input { flex:1;min-width:0;border:2px solid #ced8de;border-radius:13px;padding:12px;font-size:16px;background:#fff;color:#203244; }
    .route-steps { margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px; }
    .route-steps li { padding:9px 11px;border-radius:12px;background:#e8f0e7;color:#203244; }
    :root[data-theme="dark"] .home-event-banner { background:linear-gradient(110deg,#4a342b,#294736);color:#fff4e9;border-color:#705343; }
    :root[data-theme="dark"] .route-dest-form input { background:#fff;color:#203244; }
    :root[data-theme="dark"] .route-steps li { background:#294736;color:#f2faf1; }
    @media (min-width:640px) { .moment-photo-wide,.moment-text-wide { grid-column:span 1; } }

    function openDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return resolve(null);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbGet(key) { return new Promise((resolve, reject) => { if (!db) return resolve(null); const tx=db.transaction('records','readonly'); const r=tx.objectStore('records').get(key); r.onsuccess=()=>resolve(r.result ?? null); r.onerror=()=>reject(r.error); }); }
    function dbSet(key, value) { return new Promise((resolve, reject) => { if (!db) { try { localStorage.setItem('withyou-state', JSON.stringify(value)); resolve(); } catch(e) { reject(e); } return; } const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(value,key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); }); }
    async function save() { try { await dbSet(STATE_KEY, state); } catch(err) { showToast('I could not save this change. Please export a backup and try again.'); console.error(err); } }
    async function initStorage() {
      try { db = await openDb(); } catch (e) { db = null; }
      try {
        const loaded = db ? await dbGet(STATE_KEY) : JSON.parse(localStorage.getItem('withyou-state') || 'null');
        if (loaded && loaded.profile) { const base=defaultState(); state={...base,...loaded,profile:{...base.profile,...loaded.profile},preferences:{...base.preferences,...(loaded.preferences||{})},contacts:Array.isArray(loaded.contacts)?loaded.contacts:[],memories:Array.isArray(loaded.memories)?loaded.memories:[],medicines:Array.isArray(loaded.medicines)?loaded.medicines:[],appointments:Array.isArray(loaded.appointments)?loaded.appointments:[],tasks:Array.isArray(loaded.tasks)?loaded.tasks:[]}; }
      } catch (e) { console.warn('Saved data could not be read.', e); }
      render();
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
      setInterval(checkDueReminders, 30000);
      setInterval(applyDailyBackground, 15 * 60 * 1000);
      checkDueReminders();
    }
    function showToast(message) {
      toastEl.textContent = message; toastEl.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.add('hidden'), 4600);
    }
    function stopSpeech() {
      speechToken++;
      try { if (activeVoiceController) activeVoiceController.abort(); } catch(e) {}
      activeVoiceController=null;
      try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch(e) {}
      if (activeVoiceAudio) { try { activeVoiceAudio.pause(); activeVoiceAudio.currentTime=0; } catch(e) {} activeVoiceAudio.onended=null; activeVoiceAudio=null; }
      if (activeVoiceObjectUrl) { try { URL.revokeObjectURL(activeVoiceObjectUrl); } catch(e) {} activeVoiceObjectUrl=null; }
      if (activeRecognition) { try { activeRecognition.stop(); } catch(e) {} activeRecognition=null; }
    }
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') stopSpeech(); });
    window.addEventListener('pagehide',stopSpeech);
    async function speak(message) {
      const text=String(message||'').trim(); if(!text) return;
      stopSpeech(); const requestToken=++speechToken;
      const endpoint=String(window.CAREY_VOICE_ENDPOINT||'').trim();
      if(endpoint) {
        try {
          activeVoiceController=new AbortController();
          const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,gender:state.preferences?.companionGender==='man'?'man':'woman'}),signal:activeVoiceController.signal});
          if(requestToken!==speechToken) return;
          if(!response.ok) throw new Error('Natural voice service returned '+response.status);
          const blob=await response.blob();
          if(requestToken!==speechToken) return;
          if(!blob.type.startsWith('audio/')) throw new Error('Voice service did not return audio');
          activeVoiceObjectUrl=URL.createObjectURL(blob); const objectUrl=activeVoiceObjectUrl; activeVoiceAudio=new Audio(objectUrl);
          activeVoiceAudio.onended=()=>{if(activeVoiceObjectUrl===objectUrl){URL.revokeObjectURL(objectUrl);activeVoiceObjectUrl=null;}activeVoiceAudio=null;activeVoiceController=null;};
          await activeVoiceAudio.play(); return;
        } catch(err) { if(requestToken!==speechToken) return; activeVoiceController=null; console.warn('Natural voice service is unavailable; using this phone’s voice.',err); }
      }
      if(requestToken!==speechToken) return;
      if (!('speechSynthesis' in window)) { showToast('Spoken help is not available on this phone.'); return; }
      const gender = state.preferences?.companionGender === 'man' ? 'man' : 'woman';
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88; utterance.pitch = gender === 'man' ? 0.98 : 1.035; utterance.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const english = voices.filter(v => /^en(-|_)/i.test(v.lang));
      const genderPattern = gender === 'man' ? /male|man|daniel|alex|david|george|guy|fred|aaron|mark|oliver|james|liam/i : /female|woman|samantha|ava|karen|moira|zira|serena|victoria|tessa|susan|aria|jenny|siri/i;
      const qualityPattern = /natural|neural|premium|enhanced|google|samantha|ava|aria|jenny|daniel|siri|microsoft/i;
      const score = v => (genderPattern.test(v.name)?5:0) + (qualityPattern.test(v.name)?4:0) + (/en[-_]in/i.test(v.lang)?3:0) + (/en[-_]gb/i.test(v.lang)?1:0) + (v.default?1:0);
      const preferred = english.slice().sort((a,b)=>score(b)-score(a))[0] || voices[0];
      if (preferred) { utterance.voice = preferred; utterance.lang = preferred.lang; }
      window.speechSynthesis.speak(utterance);
    }
    function dateLabel(iso) { if (!iso) return ''; const d = new Date(`${iso}T12:00:00`); return d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}); }
    function timeLabel(t) { if (!t) return ''; const [h,m]=t.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

    function momentAgeLabel(m) {
      const raw=m.momentDate || (m.createdAt ? m.createdAt.slice(0,10) : '');
      if(!raw) return '';
      const d=new Date(`${raw}T12:00:00`); if(Number.isNaN(d.getTime())) return '';
      const now=new Date(); const years=now.getFullYear()-d.getFullYear();
      if(years>0 && now.getMonth()===d.getMonth() && now.getDate()===d.getDate() && years<=2) return years===1?'A year ago today':'Two years ago today';
      return '';
    }
    function momentDateText(m) {
      const anniversary=momentAgeLabel(m); if(anniversary) return anniversary;
      if(!m.momentDate) return m.momentTime ? `At ${timeLabel(m.momentTime)}` : '';
      const d=new Date(`${m.momentDate}T12:00:00`); if(Number.isNaN(d.getTime())) return m.momentTime ? `At ${timeLabel(m.momentTime)}` : '';
      const now=new Date();
      const date=d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined});
      const time=m.momentTime ? ` · ${timeLabel(m.momentTime)}` : '';
      return date+time;
    }

      const apptsFor = iso => state.appointments.filter(a=>a.date===iso || ((a.category==='birthday'||a.category==='special') && a.date && a.date.slice(5)===iso.slice(5)));

    function renderChat() {

      const history=chatMessages.length ? chatMessages : [{role:'carey',text:`Hello ${sayName()}. I'm glad you're here. You can ask me about medicines, daily reminders, contacts, Moments, appointments, finding home, or using carey. We can take it one step at a time.`}];
      const messageHtml=history.map((m,i)=>`<div class="chat-row ${m.role==='user'?'chat-row-user':'chat-row-carey'}">${m.role==='carey'?`<div class="chat-avatar-mini">${renderAvatar(gender,false,true)}</div>`:''}<div class="chat-bubble ${m.role==='user'?'user-bubble':'carey-bubble'}"><p>${esc(m.text)}</p>${m.role==='carey'?`<div class="chat-message-actions">${speakerButton(m.text,'Hear carey’s reply')}${m.view?`<button class="chat-open-link" type="button" data-action="chat-go" data-view="${esc(m.view)}">${esc(m.viewLabel||'Open this section')} ${ic('arrow',14)}</button>`:''}</div>`:''}</div></div>`).join('');

    function answerForCarey(raw) {
      const q=String(raw||'').toLowerCase();
      if (/\b(hello|hi|hey|good morning|good afternoon|good evening)\b/.test(q)) return {text:`Hello ${sayName()}. It’s nice to hear from you. What can I help you with?`};
      if (/medicine|medication|pill|tablet|dose/.test(q)) {
        const remaining=state.medicines.filter(m=>!(m.takenDates||[]).includes(todayStr()));
        if (!state.medicines.length) return {text:'There are no medicines listed yet. A family member can add the exact medicine details from your doctor or pharmacist.',view:'family',viewLabel:'Open Family & setup'};
        return {text:remaining.length?`You have ${remaining.length} medicine${remaining.length===1?'':'s'} not marked as taken today: ${remaining.map(m=>m.name+(m.time?' at '+timeLabel(m.time):'')).join(', ')}. Please follow the directions from your doctor or pharmacist.`:'All your listed medicines are marked as taken today. Well done. Please keep following your doctor’s instructions.',view:'medicines',viewLabel:'Open medicines'};
      }
      if (/remind|task|to do|todo|drink water|daily/.test(q)) {
        const items=state.tasks.filter(t=>(t.repeat==='daily'||!t.date||t.date>=todayStr())&&!(t.completedDates||[]).includes(todayStr())).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
        return {text:items.length?`Here are your reminders that are not checked off yet: ${items.slice(0,6).map(t=>t.title+(t.time?' at '+timeLabel(t.time):'')).join('; ')}. You can tick each one on the home page when it’s done.`:'Everything on your reminder list is checked off for today, or no reminders have been added yet.',view:'tasks',viewLabel:'Open reminders'};
      }
      if (/appointment|doctor|clinic|calendar|visit/.test(q)) {
        const items=state.appointments.filter(a=>a.date>=todayStr()).sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));
        return {text:items.length?`Your next visit is ${items[0].title} on ${dateLabel(items[0].date)}${items[0].time?' at '+timeLabel(items[0].time):''}${items[0].place?' at '+items[0].place:''}.`:'There are no upcoming doctor visits in the calendar yet. Your family can add one in Family & setup.',view:'appointments',viewLabel:'Open calendar'};
      }
      if (/contact|who is|who's calling|call someone|guardian|family/.test(q)) {
        const g=state.profile.emergencyName&&state.profile.emergencyPhone?`Your guardian is ${state.profile.emergencyName}. The number saved here is ${state.profile.emergencyPhone}. `:'Your guardian’s number has not been added yet. ';
        return {text:g+`There ${state.contacts.length===1?'is 1 contact':'are '+state.contacts.length+' contacts'} in your Contacts section. Photos and relationships can help you recognise familiar people.`,view:'contacts',viewLabel:'Open contacts'};
      }
      if (/moment|photo|picture|memory|memories|gallery/.test(q)) return {text:'Moments is a little gallery on your home page. Scroll below the main buttons to see photos and notes. A family member can add more in Family & setup.',view:'home',viewLabel:'Back to home'};
      if (/home|map|lost|direction|where am i|navigate/.test(q)) return {text:`Your saved home address is ${state.profile.homeAddress}. Tap Find home on the home page, then choose Find me on the map. If you feel unsure, stop somewhere safe and call your guardian.`,view:'route',viewLabel:'Open Find home'};
      if (/emergency|police|fire|helpline|urgent|unsafe/.test(q)) return {text:'If you are in immediate danger or need urgent help, please call your guardian or local emergency services now. The Emergency help page has the numbers saved on this phone.',view:'emergency',viewLabel:'Open Emergency help'};
      if (/setting|dark mode|light mode|appearance|voice/.test(q)) return {text:'You can choose light or dark mode and change your companion in Settings. The gear symbol is at the top left of the screen.',view:'settings',viewLabel:'Open Settings'};
      if (/thank/.test(q)) return {text:'You’re very welcome. You’re doing well, and we can take things one step at a time.'};
      return {text:'I’m here to help with carey. We can look at your medicines, reminders, contacts, Moments, doctor visits, home directions, emergency help, or settings. Which one would you like to talk about?'};
    }
    function sendChatMessage(raw, voiceReply=false) {
      const text=String(raw||'').trim(); if(!text)return;
      chatMessages.push({role:'user',text});
      const response=answerForCarey(text);
      chatMessages.push({role:'carey',text:response.text,view:response.view,viewLabel:response.viewLabel});
      if(chatMessages.length>32) chatMessages=chatMessages.slice(-32);
      currentView='chat'; render();
      const list=document.getElementById('chat-messages'); if(list) list.scrollTop=list.scrollHeight;
      if(voiceReply || chatMode==='voice') speak(response.text);
    }
    function startVoiceInput() {
      const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SpeechRecognition){showToast('Voice input is not available in this browser. Please choose Text to continue.');return;}
      try {
        if(activeRecognition){activeRecognition.stop();activeRecognition=null;}
        const rec=new SpeechRecognition(); activeRecognition=rec; rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=1;
        rec.onstart=()=>showToast('I’m listening. Speak whenever you’re ready.');
        rec.onresult=e=>{const heard=e.results?.[0]?.[0]?.transcript||'';if(heard)sendChatMessage(heard,true);};
        rec.onerror=()=>showToast('I could not hear that clearly. Please try again or type your message.');
        rec.onend=()=>{activeRecognition=null;}; rec.start();
      } catch(err){activeRecognition=null;showToast('Voice input could not start on this phone. Please use Text instead.');}
    }

    function distanceKm(lat1,lon1,lat2,lon2) { const R=6371; const rad=x=>x*Math.PI/180; const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1); const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2; return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

    async function geocodeAddress(address) {
      try { const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(address)}`; const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok) return null; const rows=await res.json(); if(!rows.length) return null; return {lat:Number(rows[0].lat),lon:Number(rows[0].lon)}; } catch(e) { return null; }
    }
    async function fetchWalkingRoute(start,destination) {
      routePath=null; routeSteps=[]; routeStepIndex=0;
      try {
        const url=`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${start.lon},${start.lat};${destination.lon},${destination.lat}?overview=full&geometries=geojson&steps=true`;
        const res=await fetch(url); if(!res.ok) throw new Error('Walking route unavailable');

    function formatRouteStep(step) {

      else if(type==='roundabout') text=`At the roundabout, take the ${m.exit||'next'} exit${street}.`;

    async function locate() {

    function checkDueReminders() {
      if (!state || !state.profile || !state.profile.name) return;
      const now=new Date(); const today=todayStr(); const hhmm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const all=[...state.medicines.map(m=>({...m,_kind:'Medicine'})),...state.tasks.map(t=>({...t,_kind:'Reminder'}))];
      for(const event of state.appointments.filter(a=>eventOccursToday(a,today))) {
        const eventKey=`${today}-Calendar-${event.id}`;
        if(!firedReminders.has(eventKey)) {
          firedReminders.add(eventKey);
          const eventType=({doctor:'Doctor visit',appointment:'Appointment',birthday:'Birthday',special:'Special day'}[event.category||'doctor']||'Calendar event');
          const message=`Today: ${eventType.toLowerCase()} — ${event.title}${event.time?' at '+timeLabel(event.time):''}.`;

        }
      }
      for(const item of all) {
        if(!item.time || item.time!==hhmm) continue;
        if(item._kind==='Reminder' && item.repeat!=='daily' && item.date!==today) continue;
        if(item._kind==='Medicine' && (item.takenDates||[]).includes(today)) continue;

        const k=`${today}-${item._kind}-${item.id}-${hhmm}`;

        }
        if(type==='profile') {
          state.profile={...state.profile,name:String(data.name||'').trim(),homeAddress:String(data.homeAddress||'').trim(),phone:String(data.phone||'').trim(),email:String(data.email||'').trim(),emergencyName:String(data.emergencyName||'').trim(),emergencyPhone:String(data.emergencyPhone||'').trim(),doctorName:String(data.doctorName||'').trim(),doctorPhone:String(data.doctorPhone||'').trim(),emergencyServiceNumber:String(data.emergencyServiceNumber||'112').trim(),policeNumber:String(data.policeNumber||'112').trim(),fireNumber:String(data.fireNumber||'101').trim(),womenHelplineNumber:String(data.womenHelplineNumber||'181').trim(),menHelplineNumber:String(data.menHelplineNumber||'').trim()};
          await save(); currentView='home'; homeCoords=null; render(); showToast('Personal details saved.'); return;
        }
        if(type==='contact') {
          const existing=editingContactId?state.contacts.find(x=>x.id===editingContactId):null;
          const photoInput=form.querySelector('[name="photo"]');
          let photo=existing?.photo||'';
          if(photoInput?.files?.[0]) photo=await resizeImage(photoInput.files[0]);
          const entry={...(existing||{}),id:existing?.id||uid(),name:String(data.name||'').trim(),relationship:String(data.relationship||'').trim(),phone:String(data.phone||'').trim(),note:String(data.note||'').trim(),photo};
          if(existing) Object.assign(existing,entry); else state.contacts.push(entry);
          editingContactId=null; await save(); currentView='contacts'; render(); showToast(existing?'Contact updated.':'Contact saved.'); return;
        }
        if(type==='memory') {
          const existing=editingMemoryId?state.memories.find(x=>x.id===editingMemoryId):null;
          const input=form.querySelector('[name="photo"]');
          let photo=existing?.photo||'';
          if(input?.files?.[0]) photo=await resizeImage(input.files[0]);
          if(data.removePhoto==='yes' && !input?.files?.[0]) photo='';
          const entry={...(existing||{}),id:existing?.id||uid(),title:String(data.title||'').trim(),person:String(data.person||'').trim(),relationship:String(data.relationship||'').trim(),note:String(data.note||'').trim(),photo,momentDate:String(data.momentDate||''),momentTime:String(data.momentTime||''),createdAt:existing?.createdAt||new Date().toISOString()};
          if(existing) Object.assign(existing,entry); else state.memories.push(entry);
          editingMemoryId=null; await save(); currentView='home'; render(); showToast(existing?'Moment updated.':'Moment added to your gallery.'); return;
        }
        if(type==='medicine') {
          const existing=editingMedicineId?state.medicines.find(x=>x.id===editingMedicineId):null;
          const entry={...(existing||{}),id:existing?.id||uid(),name:String(data.name||'').trim(),dose:String(data.dose||'').trim(),time:String(data.time||''),notes:String(data.notes||'').trim(),takenDates:existing?.takenDates||[]};
          if(existing) Object.assign(existing,entry); else state.medicines.push(entry);
          editingMedicineId=null; await save(); currentView='medicines'; render(); showToast(existing?'Medicine updated.':'Medicine saved.'); return;
        }
        if(type==='appointment') {
          const existing=editingAppointmentId?state.appointments.find(x=>x.id===editingAppointmentId):null;
          const entry={...(existing||{}),id:existing?.id||uid(),title:String(data.title||'').trim(),category:String(data.category||'doctor'),date:String(data.date||selectedDate),time:String(data.time||''),place:String(data.place||'').trim(),notes:String(data.notes||'').trim()};
          if(existing) Object.assign(existing,entry); else state.appointments.push(entry);
          editingAppointmentId=null; selectedDate=String(data.date||selectedDate); calendarMonth=new Date(`${selectedDate}T12:00:00`); calendarMonth.setDate(1); await save(); currentView='appointments'; render(); showToast(existing?'Calendar event updated.':'Calendar event saved.'); return;
        }
        if(type==='task') {
          const existing=editingTaskId?state.tasks.find(x=>x.id===editingTaskId):null;
          const entry={...(existing||{}),id:existing?.id||uid(),title:String(data.title||'').trim(),time:String(data.time||''),repeat:String(data.repeat||'daily'),date:String(data.date||todayStr()),notes:String(data.notes||'').trim(),completedDates:existing?.completedDates||[]};
          if(existing) Object.assign(existing,entry); else state.tasks.push(entry);
          editingTaskId=null; await save(); currentView='tasks'; render(); showToast(existing?'Reminder updated.':'Reminder saved.'); return;
        }
        if(type==='route-destination') {
          selectedDestinationAddress=String(data.destination||'').trim()||state.profile.homeAddress;
          routeCoords=null; homeCoords=null; routePath=null; routeSteps=[]; routeStepIndex=0;
          currentView='route'; render(); await locate(); return;
        }
      } catch(err) { console.error(err); showToast(err.message || 'I could not save that. Please try again.'); }
    }
    function celebrateCarey() {
      companionMood='happy'; clearTimeout(moodTimer);
      moodTimer=setTimeout(()=>{companionMood='neutral'; if(currentView==='home'||currentView==='tasks'||currentView==='medicines') render();},5200);
    }
    async function toggleTask(id) { const t=findItem(state.tasks,id); if(!t) return; t.completedDates=t.completedDates||[]; const i=t.completedDates.indexOf(todayStr()); if(i>=0)t.completedDates.splice(i,1);else {t.completedDates.push(todayStr());celebrateCarey();} await save(); render(); if(i<0) showToast('Well done! One more thing taken care of.'); }
    async function toggleMedicine(id) { const m=findItem(state.medicines,id); if(!m)return; m.takenDates=m.takenDates||[]; const i=m.takenDates.indexOf(todayStr()); if(i>=0)m.takenDates.splice(i,1);else {m.takenDates.push(todayStr());celebrateCarey();} await save(); render(); if(i<0) showToast('Well done! Your medicine is marked as taken.'); }
    async function deleteEntry(listName,id,view,message) { if(!caregiverUnlocked){requireCaregiver();return;} const item=state[listName].find(x=>x.id===id); if(!item)return; if(!confirm(`Remove “${item.name||item.title}”? This cannot be undone unless you have a backup.`))return; state[listName]=state[listName].filter(x=>x.id!==id); await save(); currentView=view; render(); showToast(message); }
    async function exportBackup() {
      const payload={app:'carey',schemaVersion:1,exportedAt:new Date().toISOString(),state};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`carey-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('Backup created. Keep the file somewhere private.');
    }
    function importBackup() { importInput.click(); }
    importInput.addEventListener('change', async () => {
      if(!importInput.files || !importInput.files[0]) return;
      if(!caregiverUnlocked) { importInput.value=''; requireCaregiver(); return; }
      try { const txt=await importInput.files[0].text(); const payload=JSON.parse(txt); const data=payload.state||payload; if(!data.profile || !Array.isArray(data.contacts) || !Array.isArray(data.memories)) throw new Error('That does not look like a carey backup.'); if(!confirm('Replace the information on this phone with the backup? Export a backup first if you want to keep the current information.')) return; state={...defaultState(),...data,profile:{...defaultState().profile,...data.profile}}; await save(); currentView='home'; render(); showToast('Backup imported.'); } catch(err) { showToast(err.message||'I could not import that backup.'); } finally { importInput.value=''; }
    });
    document.addEventListener('click', async event => {
      const el=event.target.closest('[data-action]'); if(!el)return;
      const action=el.dataset.action;
      if(action!=='speak') stopSpeech();
      if(action==='go') { stopSpeech(); if(el.dataset.view==='contact-form') editingContactId=null; if(el.dataset.view==='memory-form') editingMemoryId=null; if(el.dataset.view==='medicine-form') editingMedicineId=null; if(el.dataset.view==='appointment-form') editingAppointmentId=null; if(el.dataset.view==='task-form') editingTaskId=null; currentView=el.dataset.view||'home'; render(); window.scrollTo({top:0,behavior:'smooth'}); if(currentView==='route') locate(); return; }
      if(action==='chat-open') { stopSpeech(); chatMode='text'; currentView='chat'; render(); window.scrollTo({top:0,behavior:'smooth'}); const input=document.getElementById('chat-message'); if(input) setTimeout(()=>input.focus(),120); return; }
      if(action==='chat-mode') { chatMode=el.dataset.mode==='voice'?'voice':'text'; render(); return; }
      if(action==='start-voice-input') { startVoiceInput(); return; }
      if(action==='chat-suggest') { sendChatMessage(el.dataset.message||'',chatMode==='voice'); return; }
      if(action==='chat-go') { stopSpeech(); currentView=el.dataset.view||'home'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='set-theme') { stopSpeech(); state.preferences=state.preferences||{}; state.preferences.theme=el.dataset.theme==='dark'?'dark':'light'; await save(); render(); showToast(state.preferences.theme==='dark'?'Dark mode is on.':'Light mode is on.'); return; }
      if(action==='edit-contact') { if(!caregiverUnlocked){requireCaregiver();return;} stopSpeech(); editingContactId=el.dataset.id; currentView='contact-form'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='edit-memory') { if(!caregiverUnlocked){requireCaregiver();return;} stopSpeech(); editingMemoryId=el.dataset.id; currentView='memory-form'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='edit-medicine') { if(!caregiverUnlocked){requireCaregiver();return;} stopSpeech(); editingMedicineId=el.dataset.id; currentView='medicine-form'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='edit-appointment') { if(!caregiverUnlocked){requireCaregiver();return;} stopSpeech(); editingAppointmentId=el.dataset.id; currentView='appointment-form'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='edit-task') { if(!caregiverUnlocked){requireCaregiver();return;} stopSpeech(); editingTaskId=el.dataset.id; currentView='task-form'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='route-home') { selectedDestinationAddress=state.profile.homeAddress; routeCoords=null; homeCoords=null; routePath=null; routeSteps=[]; routeStepIndex=0; locate(); return; }
      if(action==='route-next-step') { if(routeSteps.length){const step=routeSteps[Math.min(routeStepIndex,routeSteps.length-1)]; speak(step.instruction); routeStepIndex=Math.min(routeStepIndex+1,routeSteps.length-1);} else speak('For safe walking directions, open the walking route in your phone map.'); return; }
      if(action==='choose-companion') { stopSpeech(); state.preferences=state.preferences||{}; state.preferences.companionGender=el.dataset.gender==='man'?'man':'woman'; state.preferences.companionChosen=true; await save(); currentView='settings'; render(); speak(state.preferences.companionGender==='man'?'Hello, I’m here with you.':'Hello, I’m here with you.'); showToast('Your companion has been changed.'); return; }
      if(action==='speak-home') { speak(`Hello ${sayName()}. Today, you have ${state.medicines.filter(m=>!(m.takenDates||[]).includes(todayStr())).length} medicines not marked as taken and ${state.tasks.filter(t=>(t.repeat==='daily'||!t.date||t.date>=todayStr())&&!(t.completedDates||[]).includes(todayStr())).length} reminders to check. Your guardian is ${state.profile.emergencyName||'not added yet'}.`); return; }
      if(action==='speak') { speak(el.dataset.text||''); return; }
      if(action==='locate') { locate(); return; }
      if(action==='notifications') { askNotifications(); return; }
      if(action==='lock-family') { caregiverUnlocked=false; currentView='family'; render(); showToast('Family editing is locked.'); return; }
      if(action==='toggle-task') { toggleTask(el.dataset.id); return; }
      if(action==='toggle-medicine') { toggleMedicine(el.dataset.id); return; }
      if(action==='delete-contact') { deleteEntry('contacts',el.dataset.id,'contacts','Person removed.'); return; }
      if(action==='delete-memory') { deleteEntry('memories',el.dataset.id,currentView==='home'?'home':'memories','Moment removed.'); return; }
      if(action==='delete-medicine') { deleteEntry('medicines',el.dataset.id,'medicines','Medicine removed.'); return; }
      if(action==='delete-task') { deleteEntry('tasks',el.dataset.id,'tasks','Reminder removed.'); return; }
      if(action==='delete-appointment') { deleteEntry('appointments',el.dataset.id,'appointments','Appointment removed.'); return; }
      if(action==='month-prev') { calendarMonth.setMonth(calendarMonth.getMonth()-1); render(); return; }
      if(action==='month-next') { calendarMonth.setMonth(calendarMonth.getMonth()+1); render(); return; }
      if(action==='calendar-today') { selectedDate=todayStr(); calendarMonth=new Date(); calendarMonth.setDate(1); render(); return; }
      if(action==='select-date') { selectedDate=el.dataset.date; render(); return; }
      if(action==='export') { if(!caregiverUnlocked){requireCaregiver();return;} exportBackup(); return; }
      if(action==='import') { if(!caregiverUnlocked){requireCaregiver();return;} importBackup(); return; }
    });
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('change', async e=>{
      if(e.target && e.target.id==='contact-photo' && e.target.files && e.target.files[0]) {
        try { const data=await resizeImage(e.target.files[0]); const preview=document.getElementById('contact-photo-preview'); if(preview){preview.innerHTML=`<img class="contact-avatar-photo" src="${data}" alt="Contact photo preview">`;preview.classList.remove('hidden');} } catch(err){showToast(err.message);}
      }
      if(e.target && e.target.id==='memory-photo' && e.target.files && e.target.files[0]) {
        try { const data=await resizeImage(e.target.files[0]); const preview=document.getElementById('photo-preview'); if(preview){preview.innerHTML=`<img class="photo" src="${data}" alt="Photo preview" style="width:120px;height:120px">`;preview.classList.remove('hidden');} } catch(err){showToast(err.message);}
      }
      if(e.target && e.target.id==='task-repeat') { const f=document.getElementById('task-date-field'); if(f) f.classList.toggle('hidden',e.target.value!=='once'); }
    });
    initStorage();
  })();
  </script>
</body>
</html>
