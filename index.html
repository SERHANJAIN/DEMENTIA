  <title>carey — A little help, right when you need it</title>
  <style>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input class="file-input" id="import-file" type="file" accept="application/json,.json">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script>
  (() => {
    'use strict';
    const DB_NAME = 'withyou-local'; // Kept stable so existing saved data survives the app rename.
    const DB_VERSION = 1;
    const STATE_KEY = 'app-state';
    const main = document.getElementById('main');
    const toastEl = document.getElementById('toast');
    const voiceIconEl = document.getElementById('voice-icon');
    const importInput = document.getElementById('import-file');
    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    const esc = (s='') => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const ICONS = {
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10Z"/><path d="M8 21v-5h8v5"/>',
      map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15M15 6v15"/>',
      users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
      heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',
      pill:'<path d="m10.5 20.5 10-10a5 5 0 0 0-7.1-7.1l-10 10a5 5 0 0 0 7.1 7.1Z"/><path d="m8 8 8 8"/>',
      calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      siren:'<path d="M5 18h14l-1.3-8a5.7 5.7 0 0 0-11.4 0L5 18Z"/><path d="M3 21h18M12 2V1M3.5 5 2 3.5M20.5 5 22 3.5"/>',
      settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1A8 8 0 0 1 7 13l-1.8-.3V9.9L7 9.6a8 8 0 0 1 .9-1.7L6.5 6.5l1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.4a8 8 0 0 1 .9 1.7l1.8.3v2.8l-1.8.3a8 8 0 0 1-.8 2.2Z"/>',
      phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.4 2.8a2 2 0 0 1-.6 1.7L7 10.1a16 16 0 0 0 6 6l1.9-1.9a2 2 0 0 1 1.7-.6l2.8.4a2 2 0 0 1 1.6 1.9Z"/>',
      volume:'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      arrow:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
      pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5"/>',
      download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
      upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
      info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
      smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
      book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22V4.5Z"/><path d="M4 18a2 2 0 0 1 2-2h14"/>',
      edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
      refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 17 5l3 2M4 17l3 2a7 7 0 0 0 11.4-4"/>',
      shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',
      star:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/>',
      compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.5 5.9-5.9 2.5 2.5-5.9Z"/>',
      alert:'<path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
      checkcircle:'<circle cx="12" cy="12" r="10"/><path d="m8 12 2.5 2.5L16 9"/>',
      image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
      message:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>'
    };
    const ic = (name, size=24) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.info}</svg>`;
    const defaultState = () => ({
      profile: { name:'', homeAddress:'', phone:'', email:'', emergencyName:'', emergencyPhone:'', emergencyServiceNumber:'112', doctorName:'', doctorPhone:'', policeNumber:'112', fireNumber:'101', womenHelplineNumber:'181', menHelplineNumber:'', caregiverPin:'' },
      preferences: { companionGender:'', companionChosen:false },
      contacts: [], memories: [], medicines: [], appointments: [], tasks: []
    });
    let state = defaultState();
    let db = null;
    let currentView = 'home';
    let caregiverUnlocked = false;
    let selectedDate = todayStr();
    let calendarMonth = new Date(); calendarMonth.setDate(1);
    let routeCoords = null;
    let homeCoords = null;
    let leafletMap = null;
    let firedReminders = new Set();
    let toastTimer = null;

    function openDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return resolve(null);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains('records')) d.createObjectStore('records'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function dbGet(key) { return new Promise((resolve, reject) => { if (!db) return resolve(null); const tx=db.transaction('records','readonly'); const r=tx.objectStore('records').get(key); r.onsuccess=()=>resolve(r.result ?? null); r.onerror=()=>reject(r.error); }); }
    function dbSet(key, value) { return new Promise((resolve, reject) => { if (!db) { try { localStorage.setItem('withyou-state', JSON.stringify(value)); resolve(); } catch(e) { reject(e); } return; } const tx=db.transaction('records','readwrite'); tx.objectStore('records').put(value,key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); }); }
    async function save() { try { await dbSet(STATE_KEY, state); } catch(err) { showToast('I could not save this change. Please export a backup and try again.'); console.error(err); } }
    async function initStorage() {
      try { db = await openDb(); } catch (e) { db = null; }
      try {
        const loaded = db ? await dbGet(STATE_KEY) : JSON.parse(localStorage.getItem('withyou-state') || 'null');
        if (loaded && loaded.profile) { const base=defaultState(); state={...base,...loaded,profile:{...base.profile,...loaded.profile},preferences:{...base.preferences,...(loaded.preferences||{})},contacts:Array.isArray(loaded.contacts)?loaded.contacts:[],memories:Array.isArray(loaded.memories)?loaded.memories:[],medicines:Array.isArray(loaded.medicines)?loaded.medicines:[],appointments:Array.isArray(loaded.appointments)?loaded.appointments:[],tasks:Array.isArray(loaded.tasks)?loaded.tasks:[]}; }
      } catch (e) { console.warn('Saved data could not be read.', e); }
      render();
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
      setInterval(checkDueReminders, 30000);
      setInterval(applyDailyBackground, 15 * 60 * 1000);
      checkDueReminders();
    }
    function showToast(message) {
      toastEl.textContent = message; toastEl.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.add('hidden'), 4600);
    }
    function speak(message) {
      if (!('speechSynthesis' in window)) { showToast('Spoken help is not available on this phone.'); return; }
      window.speechSynthesis.cancel();
      const gender = state.preferences?.companionGender === 'man' ? 'man' : 'woman';
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.rate = 0.78; utterance.pitch = gender === 'man' ? 0.94 : 1.02; utterance.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const english = voices.filter(v => /^en(-|_)/i.test(v.lang));
      const genderPattern = gender === 'man' ? /male|man|daniel|alex|david|george|guy|fred|aaron|mark|oliver|james/i : /female|woman|samantha|ava|karen|moira|zira|serena| victoria|tessa|susan|aria|jenny/i;
      const localeVoice = english.find(v => /en[-_]in/i.test(v.lang) && genderPattern.test(v.name)) || english.find(v => genderPattern.test(v.name)) || english.find(v => /en[-_]in/i.test(v.lang)) || english[0];
      if (localeVoice) utterance.voice = localeVoice;
      window.speechSynthesis.speak(utterance);
    }
    function dateLabel(iso) { if (!iso) return ''; const d = new Date(`${iso}T12:00:00`); return d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}); }
    function timeLabel(t) { if (!t) return ''; const [h,m]=t.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
    function sayName() { return state.profile.name?.trim() || 'friend'; }
    function requireCaregiver() {
      if (caregiverUnlocked) return true;
      showToast('A family member can make changes in Family & setup.');
      currentView='family'; render(); return false;
    }
    function topTitle(title, subtitle='') {
      return `<button class="back-button" data-action="go" data-view="home">${ic('arrow',19)} Back to home</button><div class="view-head"><div class="head-copy"><p class="eyebrow">carey</p><h1>${esc(title)}</h1>${subtitle ? `<p class="lead">${esc(subtitle)}</p>` : ''}</div>${renderAvatar(state.preferences?.companionGender || 'woman',false,true)}</div>`;
    }
    function button(label, action, opts={}) {
      const cls = opts.class || 'secondary'; const iconName = opts.icon ? ic(opts.icon,21) : '';
      const attrs = Object.entries(opts.data || {}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');
      return `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${iconName}${esc(label)}</button>`;
    }
    function card(label, sub, view, iconName, tone) {
      return `<button type="button" class="home-card tone-${tone}" data-action="go" data-view="${view}"><span class="card-icon">${ic(iconName,27)}</span><span><span class="card-label">${esc(label)}</span><span class="card-sub">${esc(sub)}</span></span></button>`;
    }
    function renderAvatar(gender='woman', large=false, small=false) {
      const man = gender === 'man';
      const hair = man
        ? '<path d="M22 45C20 23 34 11 51 11c18 0 30 12 29 34l-7-7-3-10c-9 8-24 10-39 8l-4 9Z" fill="#6C4E3D"/>'
        : '<path d="M21 47C15 20 31 8 50 8c21 0 36 15 30 43l-3 20-10 5 2-24-5-24c-8 9-24 12-38 8l-1 19 2 21-10-6Z" fill="#674B45"/>';
      const mouth = man ? 'M39 66Q50 73 61 66' : 'M39 65Q50 75 61 65';
      return `<span class="companion-avatar ${large?'large':''} ${small?'small-avatar':''} ${man?'companion-man':'companion-woman'}" aria-hidden="true"><svg viewBox="0 0 100 100" width="100%" height="100%" role="presentation"><circle cx="50" cy="50" r="50" fill="#E1EFEB"/><g class="avatar-bob">${hair}<ellipse cx="50" cy="48" rx="25" ry="31" fill="#DDAA89"/><path d="M24 45Q18 40 24 34M76 45Q82 40 76 34" fill="none" stroke="#C78E72" stroke-width="4" stroke-linecap="round"/><path d="M35 43Q41 40 45 43M55 43Q60 40 65 43" fill="none" stroke="#6B5147" stroke-width="2.2" stroke-linecap="round"/><g class="avatar-eye" fill="#263746"><ellipse cx="40" cy="49" rx="2.5" ry="3.2"/><ellipse cx="60" cy="49" rx="2.5" ry="3.2"/></g><circle cx="34" cy="58" r="4" fill="#D98D7D" opacity=".42"/><circle cx="66" cy="58" r="4" fill="#D98D7D" opacity=".42"/><path d="${mouth}" fill="none" stroke="#8C4E49" stroke-width="2.4" stroke-linecap="round"/><path d="M32 31Q50 18 68 31" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".35"/></g></svg></span>`;
    }
    function speakerButton(message, label, extraClass='') {
      return `<button type="button" class="speaker-button ${extraClass}" data-action="speak" data-text="${esc(message)}" aria-label="${esc(label)}" title="${esc(label)}">${ic('volume',19)}</button>`;
    }
    function applyDailyBackground() {
      const d = new Date();
      const day = Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0)) / 86400000) % 7;
      const moods = [
        'linear-gradient(145deg,#f6f6ed 0%,#e5efeb 55%,#f9eee4 100%)',
        'linear-gradient(145deg,#f4f5eb 0%,#e5eede 52%,#edf4f1 100%)',
        'linear-gradient(145deg,#f5f4ed 0%,#e3edf0 54%,#f7ede5 100%)',
        'linear-gradient(145deg,#faf0e7 0%,#f4e5dc 45%,#e5f0eb 100%)',
        'linear-gradient(145deg,#f6f5ed 0%,#e8ebf3 50%,#edf4ed 100%)',
        'linear-gradient(145deg,#f7f3e9 0%,#f7e7d9 46%,#e7f1eb 100%)',
        'linear-gradient(145deg,#f5f4ea 0%,#e1efec 50%,#f5e8ec 100%)'
      ];
      document.documentElement.style.setProperty('--daily-background', moods[day]);
    }

    function render() {
      document.title = 'carey — A little help, right when you need it';
      voiceIconEl.innerHTML = ic('volume',20);
      applyDailyBackground();
      if (!state.profile.name || !state.profile.homeAddress || !state.preferences?.companionChosen) { currentView='setup'; main.innerHTML=renderSetup(); return; }
      const renderers = {
        home: renderHome, setup: renderSetup, route: renderRoute, contacts: renderContacts, memories: renderMemories,
        medicines: renderMedicines, appointments: renderAppointments, tasks: renderTasks, about: renderAbout,
        emergency: renderEmergency, family: renderFamily, settings: renderSettings, 'memory-form': renderMemoryForm, 'contact-form': renderContactForm,
        'medicine-form': renderMedicineForm, 'appointment-form': renderAppointmentForm, 'task-form': renderTaskForm,
        'profile-form': renderProfileForm
      };
      main.innerHTML = (renderers[currentView] || renderHome)();
      if (currentView==='route' && routeCoords) drawMap();
    }
    function renderSetup() {
      const selected = state.preferences?.companionGender === 'man' ? 'man' : state.preferences?.companionGender === 'woman' ? 'woman' : '';
      const avatarChoice = selected || 'woman';
      return `<div class="home-intro"><p class="eyebrow">Welcome to carey</p><div class="identity-home"><div class="identity-copy"><h1>Let’s make this feel like home.</h1><p class="lead">We’ll keep the important things close by.</p></div>${renderAvatar(avatarChoice,true)}</div></div>
        <form data-form="setup" class="panel"><h2>Who would you like by your side?</h2><div class="companion-options">
          <label class="companion-choice"><input type="radio" name="companionGender" value="woman" ${selected==='woman'?'checked':''} required>${renderAvatar('woman')}<strong>Woman</strong></label>
          <label class="companion-choice"><input type="radio" name="companionGender" value="man" ${selected==='man'?'checked':''} required>${renderAvatar('man')}<strong>Man</strong></label>
        </div><div class="form-section"><h3>About you</h3></div><div class="form-grid">
          <div class="field"><label for="setup-name">What name do you like to be called?</label><input id="setup-name" name="name" value="${esc(state.profile.name)}" autocomplete="name" required maxlength="100" placeholder="Your name"></div>
          <div class="field"><label for="setup-home">Your home address</label><textarea id="setup-home" name="homeAddress" autocomplete="street-address" required maxlength="300" placeholder="House number, street, area, city">${esc(state.profile.homeAddress)}</textarea><span class="hint">This helps the map find your home.</span></div>
        </div><div class="form-section"><h3>Your guardian</h3><p class="small muted">Their number will be easy to call from the home screen.</p></div>
          <div class="form-grid two"><div class="field"><label for="setup-phone">Your phone number</label><input id="setup-phone" name="phone" value="${esc(state.profile.phone)}" type="tel" autocomplete="tel" placeholder="Phone number"></div><div class="field"><label for="setup-email">Your email</label><input id="setup-email" name="email" value="${esc(state.profile.email)}" type="email" autocomplete="email" placeholder="Email address"></div>
          <div class="field"><label for="setup-emergency-name">Guardian’s name</label><input id="setup-emergency-name" name="emergencyName" value="${esc(state.profile.emergencyName)}" placeholder="Name of family member"></div><div class="field"><label for="setup-emergency-phone">Guardian’s phone</label><input id="setup-emergency-phone" name="emergencyPhone" value="${esc(state.profile.emergencyPhone)}" type="tel" placeholder="Phone number"></div></div>
          <div class="form-actions"><button class="primary" type="submit">Save and continue ${ic('arrow',20)}</button></div>
        </form>`;
    }
    function renderHome() {
      const now = new Date();
      const hour = now.getHours(); const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      const p = state.profile;
      const today = todayStr();
      const meds = state.medicines.slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const todoMeds = meds.filter(m => !(m.takenDates||[]).includes(today));
      const tasks = state.tasks.filter(t => (t.repeat==='daily' || !t.date || t.date>=today) && !(t.completedDates||[]).includes(today)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      const guardianPhone = p.emergencyPhone || '';
      const guardianName = p.emergencyName || 'Your guardian';
      const renderMedRow = m => `<div class="today-item"><div class="today-item-copy"><p class="today-item-name">${esc(m.name)}</p><div class="today-item-meta">${esc(m.time?timeLabel(m.time):'No time set')}${m.dose?` · ${esc(m.dose)}`:''}</div></div><button class="today-check" type="button" aria-label="Mark ${esc(m.name)} taken today" title="Mark taken" data-action="toggle-medicine" data-id="${esc(m.id)}">${ic('check',17)}</button></div>`;
      const renderTaskRow = t => `<div class="today-item"><div class="today-item-copy"><p class="today-item-name">${esc(t.title)}</p><div class="today-item-meta">${esc(t.time?timeLabel(t.time):(t.repeat==='daily'?'Any time today':'Today'))}</div></div><button class="today-check" type="button" aria-label="Mark ${esc(t.title)} done" title="Mark done" data-action="toggle-task" data-id="${esc(t.id)}">${ic('check',17)}</button></div>`;
      const medRows = todoMeds.slice(0,2).map(renderMedRow).join('');
      const taskRows = tasks.slice(0,2).map(renderTaskRow).join('');
      const medEmpty = `<div class="today-item"><div class="today-item-copy"><p class="today-item-name">${meds.length?'All checked for today':'No medicines added'}</p><div class="today-item-meta">${meds.length?'You’re doing well.':'A family member can add them.'}</div></div></div>`;
      const taskEmpty = `<div class="today-item"><div class="today-item-copy"><p class="today-item-name">${state.tasks.length?'All done for today':'No reminders yet'}</p><div class="today-item-meta">${state.tasks.length?'One step at a time.':'A family member can add them.'}</div></div></div>`;
      return `<div class="home-intro">
          <div class="identity-home">
            ${renderAvatar(state.preferences?.companionGender || 'woman')}
            <div class="identity-copy"><p class="eyebrow">${esc(now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}</p><h1>${hello}, ${esc(sayName())}.</h1><div class="identity-details">${esc(p.homeAddress)}${p.phone?` · ${esc(p.phone)}`:''}</div><button class="identity-link" type="button" data-action="go" data-view="about">My details ${ic('arrow',12)}</button></div>
            ${speakerButton(`Hello ${sayName()}. ${hello}. I'm glad you're here. What would you like help with today?`,'Hear greeting')}
          </div>
        </div>
        ${guardianPhone ? `<a class="guardian-strip" href="tel:${esc(guardianPhone)}" aria-label="Call guardian ${esc(guardianName)}"><span>${ic('phone',22)}</span><span class="guardian-copy"><span class="guardian-label">Your guardian · call anytime</span><span class="guardian-name">${esc(guardianName)}</span><span class="guardian-number">${esc(guardianPhone)}</span></span><span>${ic('arrow',18)}</span></a>` : `<button class="guardian-strip" type="button" data-action="go" data-view="profile-form"><span>${ic('phone',22)}</span><span class="guardian-copy"><span class="guardian-label">Your guardian</span><span class="guardian-name">Add guardian’s number</span></span><span>${ic('arrow',18)}</span></button>`}
        <section class="today-priority" aria-label="Today's medicines and reminders">
          <div class="today-heading"><h2>Today</h2><span class="date-small">Small steps, at your pace</span></div>
          <div class="today-columns">

    function renderRoute() {

        <div class="panel soft-sage"><h3>Ready to go home?</h3><p class="small">Open your phone’s map for walking directions. Your map app can guide you along the streets.</p><a class="primary" href="${esc(mapUrl)}" target="_blank" rel="noopener">${ic('map',21)} Open walking directions</a><div style="margin-top:8px">${speakerButton("I will open walking directions to your saved home address. Please follow the directions on your phone's map. If you feel unsure, stop somewhere safe and call your guardian or emergency contact.",'Hear directions advice')}</div></div>

        <div class="notice"><span class="notice-icon">${ic('clock',22)}</span><div><strong>One step at a time</strong><p class="small" style="margin-bottom:0">Check the list on your home screen when it is time for your medicines. Follow the instructions from your doctor or pharmacist.</p></div></div>`;
    }
    function renderAppointments() {
      const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
      const firstDay = new Date(year,month,1).getDay(); const days = new Date(year,month+1,0).getDate();
      const prevDays = new Date(year,month,0).getDate();
      const cells=[];
      for(let i=0;i<firstDay;i++) cells.push({day:prevDays-firstDay+i+1, date:dateOf(year,month-1,prevDays-firstDay+i+1), other:true});
      for(let d=1;d<=days;d++) cells.push({day:d,date:dateOf(year,month,d),other:false});
      let next=1; while(cells.length%7!==0) cells.push({day:next,date:dateOf(year,month+1,next++),other:true});
      const apptsFor = iso => state.appointments.filter(a=>a.date===iso);
      const selected = apptsFor(selectedDate);
      return `${topTitle('Doctor visits','Choose a date to see what is planned.')}
        <div class="panel"><div class="calendar-header"><button class="month-nav" aria-label="Previous month" data-action="month-prev" type="button">${ic('arrow',19)}</button><div class="month-name">${esc(calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'}))}</div><button class="month-nav" aria-label="Next month" data-action="month-next" type="button">${ic('arrow',19).replace('M19 12H5M12 19l-7-7 7-7','M5 12h14M12 5l7 7-7 7')}</button></div>
          <div class="calendar" role="grid" aria-label="Appointment calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.map(c=>`<button type="button" role="gridcell" aria-label="${esc(dateLabel(c.date))}${apptsFor(c.date).length?' with appointment':''}" aria-pressed="${selectedDate===c.date}" class="day ${c.other?'muted-day':''} ${selectedDate===c.date?'selected':''} ${c.date===todayStr()?'today':''}" data-action="select-date" data-date="${c.date}"><span>${c.day}</span>${apptsFor(c.date).length?'<span class="dot"></span>':''}</button>`).join('')}</div>
          <div class="button-row" style="margin-top:15px"><button class="secondary small-button" type="button" data-action="calendar-today">${ic('calendar',17)} Today</button>${caregiverUnlocked?`<button class="primary small-button" type="button" data-action="go" data-view="appointment-form">${ic('plus',17)} Add visit</button>`:`<button class="secondary small-button" type="button" data-action="go" data-view="family">${ic('plus',17)} Family: add visit</button>`}</div>
        </div>
        <h2 style="margin-top:22px">${esc(dateLabel(selectedDate))}</h2>

        <div class="panel soft-sage"><div class="status-line">${ic('checkcircle',22)} <span>Tick a task when you have done it.</span></div><p class="small" style="margin-bottom:0">A family member using this same device can see which tasks you have checked.</p></div>

    function dateOf(y,m,d) { const dt=new Date(y,m,d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
    function distanceKm(lat1,lon1,lat2,lon2) { const R=6371; const rad=x=>x*Math.PI/180; const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1); const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2; return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

    async function geocodeAddress(address) {
      try { const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(address)}`; const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok) return null; const rows=await res.json(); if(!rows.length) return null; return {lat:Number(rows[0].lat),lon:Number(rows[0].lon)}; } catch(e) { return null; }

    async function locate() {
      if (!navigator.geolocation) { showToast('This phone cannot share its location with the browser. You can still open walking directions.'); return; }

      navigator.geolocation.getCurrentPosition(async pos=>{

        homeCoords=await geocodeAddress(state.profile.homeAddress);
        render();
        if(homeCoords) {
          const d=distanceKm(routeCoords.lat,routeCoords.lon,homeCoords.lat,homeCoords.lon);
          speak(d<.15 ? 'You seem to be very close to home. For the safest route, open walking directions.' : `Home is about ${d<1?Math.round(d*1000)+' metres':d.toFixed(1)+' kilometres'} away, ${bearingText(routeCoords.lat,routeCoords.lon,homeCoords.lat,homeCoords.lon)}. The dotted line is not a walking path. Tap open walking directions to get the route.`);
        } else speak('I found your location, but could not pinpoint your saved home on the simple map. Tap open walking directions and your phone map can try the address.');
      }, err=>{ showToast(err.code===1?'Location permission was not allowed. You can still open walking directions.':'I could not find your location. Please try again or open walking directions.'); }, {enableHighAccuracy:true,timeout:12000,maximumAge:60000});

    function drawMap() {
      const mapEl=document.getElementById('map'); if(!mapEl) return;
      if(!window.L) { mapEl.innerHTML='<div class="map-placeholder">The map could not load. Please check your internet connection and use walking directions below.</div>'; return; }
      if(leafletMap) { try{leafletMap.remove();}catch(e){} leafletMap=null; }
      const center=homeCoords ? [(routeCoords.lat+homeCoords.lat)/2,(routeCoords.lon+homeCoords.lon)/2] : [routeCoords.lat,routeCoords.lon];
      leafletMap=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView(center,homeCoords?13:16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
      L.circleMarker([routeCoords.lat,routeCoords.lon],{radius:9,color:'#243b53',weight:3,fillColor:'#243b53',fillOpacity:1}).addTo(leafletMap).bindPopup('You are here');

    function checkDueReminders() {
      if (!state || !state.profile || !state.profile.name) return;
      const now=new Date(); const today=todayStr(); const hhmm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const all=[...state.medicines.map(m=>({...m,_kind:'Medicine'})),...state.tasks.map(t=>({...t,_kind:'Reminder'}))];
      for(const item of all) {
        if(!item.time || item.time!==hhmm) continue;
        if(item._kind==='Reminder' && item.repeat!=='daily' && item.date!==today) continue;
        if(item._kind==='Medicine' && (item.takenDates||[]).includes(today)) continue;
        if(item._kind==='Reminder' && (item.completedDates||[]).includes(today)) continue;
        const k=`${today}-${item._kind}-${item.id}-${hhmm}`;
        if(firedReminders.has(k)) continue; firedReminders.add(k);
        const msg=`carey reminder: ${item._kind.toLowerCase()} time. ${item.name||item.title}.`;
        if('Notification' in window && Notification.permission==='granted' && document.visibilityState==='visible') {
          try { new Notification('carey reminder',{body:msg,icon:'./icons/icon-192.png',tag:k}); } catch(e) {}
        }
        showToast(msg);
      }
    }

      if(!importInput.files || !importInput.files[0]) return;
      if(!caregiverUnlocked) { importInput.value=''; requireCaregiver(); return; }
      try { const txt=await importInput.files[0].text(); const payload=JSON.parse(txt); const data=payload.state||payload; if(!data.profile || !Array.isArray(data.contacts) || !Array.isArray(data.memories)) throw new Error('That does not look like a carey backup.'); if(!confirm('Replace the information on this phone with the backup? Export a backup first if you want to keep the current information.')) return; state={...defaultState(),...data,profile:{...defaultState().profile,...data.profile}}; await save(); currentView='home'; render(); showToast('Backup imported.'); } catch(err) { showToast(err.message||'I could not import that backup.'); } finally { importInput.value=''; }
    });
    document.addEventListener('click', async event => {
      const el=event.target.closest('[data-action]'); if(!el)return;
      const action=el.dataset.action;
      if(action==='go') { currentView=el.dataset.view||'home'; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
      if(action==='choose-companion') { state.preferences=state.preferences||{}; state.preferences.companionGender=el.dataset.gender==='man'?'man':'woman'; state.preferences.companionChosen=true; await save(); currentView='settings'; render(); speak(state.preferences.companionGender==='man'?'Hello, I’m here with you.':'Hello, I’m here with you.'); showToast('Your companion has been changed.'); return; }
      if(action==='speak-home') { speak(`Hello ${sayName()}. Today, you have ${state.medicines.filter(m=>!(m.takenDates||[]).includes(todayStr())).length} medicines not marked as taken and ${state.tasks.filter(t=>(t.repeat==='daily'||!t.date||t.date>=todayStr())&&!(t.completedDates||[]).includes(todayStr())).length} reminders to check. Your guardian is ${state.profile.emergencyName||'not added yet'}.`); return; }
      if(action==='speak') { speak(el.dataset.text||''); return; }
      if(action==='locate') { locate(); return; }
      if(action==='notifications') { askNotifications(); return; }
      if(action==='lock-family') { caregiverUnlocked=false; currentView='family'; render(); showToast('Family editing is locked.'); return; }
      if(action==='toggle-task') { toggleTask(el.dataset.id); return; }
      if(action==='toggle-medicine') { toggleMedicine(el.dataset.id); return; }
      if(action==='delete-contact') { deleteEntry('contacts',el.dataset.id,'contacts','Person removed.'); return; }
      if(action==='delete-memory') { deleteEntry('memories',el.dataset.id,'memories','Moment removed.'); return; }
      if(action==='delete-medicine') { deleteEntry('medicines',el.dataset.id,'medicines','Medicine removed.'); return; }
      if(action==='delete-task') { deleteEntry('tasks',el.dataset.id,'tasks','Reminder removed.'); return; }
      if(action==='delete-appointment') { deleteEntry('appointments',el.dataset.id,'appointments','Appointment removed.'); return; }
      if(action==='month-prev') { calendarMonth.setMonth(calendarMonth.getMonth()-1); render(); return; }
      if(action==='month-next') { calendarMonth.setMonth(calendarMonth.getMonth()+1); render(); return; }
      if(action==='calendar-today') { selectedDate=todayStr(); calendarMonth=new Date(); calendarMonth.setDate(1); render(); return; }
      if(action==='select-date') { selectedDate=el.dataset.date; render(); return; }
      if(action==='export') { if(!caregiverUnlocked){requireCaregiver();return;} exportBackup(); return; }
      if(action==='import') { if(!caregiverUnlocked){requireCaregiver();return;} importBackup(); return; }
    });
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('change', async e=>{
      if(e.target && e.target.id==='memory-photo' && e.target.files && e.target.files[0]) {
        try { const data=await resizeImage(e.target.files[0]); const preview=document.getElementById('photo-preview'); if(preview){preview.innerHTML=`<img class="photo" src="${data}" alt="Photo preview" style="width:120px;height:120px">`;preview.classList.remove('hidden');} } catch(err){showToast(err.message);}
      }
      if(e.target && e.target.id==='task-repeat') { const f=document.getElementById('task-date-field'); if(f) f.classList.toggle('hidden',e.target.value!=='once'); }
    });
    initStorage();
  })();
  </script>
</body>
</html>
