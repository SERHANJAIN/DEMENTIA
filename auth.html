<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b53"><title>Sign in · Pal</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#edf3ed,#f7f2eb 58%,#e8f0f1);font:16px/1.5 "Trebuchet MS",Arial,sans-serif;color:#243746}.panel{width:min(100%,440px);background:#fff;border:1px solid #d8e2dc;border-radius:24px;padding:28px;box-shadow:0 18px 50px #243b5312}.brand{font-size:34px;font-weight:800;color:#243b53}.sub{color:#61747c;margin:4px 0 22px}h1{font-size:24px;color:#243b53}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #cbd8d1;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:13px;background:#243b53;color:#fff;font:700 16px inherit;margin-top:14px;cursor:pointer}.secondary{background:#e8f0e7;color:#243b53}.muted{font-size:13px;color:#61747c}.status{padding:10px;border-radius:10px;background:#f7f2eb;margin-top:14px;white-space:pre-wrap}.hidden{display:none}
</style></head><body><main class="panel"><div class="brand">Pal</div><div class="sub">Care, connection and peace of mind.</div><h1 id="heading">Sign in</h1><p class="muted" id="intro">Use your email and password to continue.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button></form><button class="secondary" id="toggle" type="button">Create an account</button><p class="muted" id="role-note"></p><div class="status hidden" id="status" role="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const U='https://nukmfdejnionugwqgwgo.supabase.co',K='sb_publishable_HWpCOnO4lnT6cRMTB9zVxg_gSlZ-Rpt';const db=supabase.createClient(U,K);const p=new URLSearchParams(location.search);const role=p.get('role')==='guardian'?'guardian':'pal';const next=p.get('next')==='family.html'?'family.html':'index.html';let signup=false;
const $=id=>document.getElementById(id),status=$('status');$('role-note').textContent=role==='guardian'?'Guardian access is activated only after accepting a Pal invitation.':'Your Pal account keeps your sign-in separate from other users.';
function say(t){status.textContent=t;status.classList.remove('hidden')}
$('toggle').onclick=()=>{signup=!signup;$('heading').textContent=signup?'Create your account':'Sign in';$('intro').textContent=signup?'Create an account with your email address.':'Use your email and password to continue.';$('submit').textContent=signup?'Create account':'Sign in';$('toggle').textContent=signup?'I already have an account':'Create an account';$('password').autocomplete=signup?'new-password':'current-password';};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const email=$('email').value.trim(),password=$('password').value;let result;if(signup){result=await db.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});if(result.error)throw result.error;if(!result.data.session){say('Check your email to confirm your account. Then return here and sign in.');return;}}else{result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;}location.href='./'+next;}catch(err){say(err.message||'Unable to sign in. Please try again.');}finally{$('submit').disabled=false;}};
db.auth.getSession().then(({data})=>{if(data.session)location.href='./'+next;});
})();
</script></body></html>
